<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PersonaFlow｜生成歷史</title>
  <style>
    :root { color-scheme: dark; --bg:#070b12; --panel:#111824; --line:#263247; --muted:#93a1b5; --text:#edf3fb; --accent:#65d3ff; --green:#6ee7a8; --yellow:#f6c85f; --red:#ff7b86; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,"Noto Sans TC",system-ui,sans-serif; background:radial-gradient(circle at 10% 0,#132039 0,transparent 36%),var(--bg); color:var(--text); min-height:100vh; }
    header { padding:22px clamp(18px,4vw,54px); border-bottom:1px solid var(--line); background:#09101bcc; backdrop-filter:blur(14px); position:sticky; top:0; z-index:20; }
    .topline { display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:space-between; }
    h1 { font-size:clamp(21px,3vw,32px); margin:0; letter-spacing:.02em; }
    h2 { margin:0 0 14px; font-size:20px; } h3 { margin:12px 0; }
    a { color:var(--accent); text-decoration:none; }
    main { width:min(1500px,calc(100% - 28px)); margin:22px auto 60px; }
    .notice { color:var(--muted); margin:0 0 16px; }
    .panel { background:linear-gradient(150deg,#131d2b,#0e1520); border:1px solid var(--line); border-radius:15px; padding:18px; margin-bottom:14px; box-shadow:0 14px 34px #0004; }
    .cards { display:grid; grid-template-columns:repeat(8,minmax(115px,1fr)); gap:9px; margin-bottom:14px; }
    .card { background:#0e1623; border:1px solid var(--line); border-radius:12px; padding:13px; min-height:85px; }
    .label,.muted,.help { color:var(--muted); font-size:12px; } .value { display:block; margin-top:8px; font-size:20px; }
    button,input,select,textarea { font:inherit; }
    button,.button { border:1px solid #3a4a64; border-radius:9px; background:#172235; color:var(--text); padding:9px 13px; cursor:pointer; }
    button:hover { border-color:var(--accent); } button.primary { background:var(--accent); color:#05131c; border-color:var(--accent); font-weight:800; }
    button:disabled { opacity:.42; cursor:not-allowed; }
    input,select,textarea { width:100%; border:1px solid var(--line); border-radius:9px; background:#080e17; color:var(--text); padding:10px; }
    textarea { min-height:78px; resize:vertical; }
    label { display:grid; gap:5px; color:#c9d4e4; font-size:13px; }
    .form-grid { display:grid; grid-template-columns:repeat(3,minmax(160px,1fr)); gap:12px; }
    .form-grid .wide { grid-column:1/-1; }
    .table-wrap { overflow:auto; max-width:100%; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th,td { padding:10px; border-bottom:1px solid #202c3e; text-align:left; vertical-align:top; white-space:nowrap; }
    th { color:#9fb0c7; position:sticky; top:0; background:#111a28; }
    tbody tr[data-id] { cursor:pointer; } tbody tr[data-id]:hover { background:#172235; }
    tbody tr[data-id] td:first-child::before { content:"▸"; display:inline-block; width:1em; color:var(--muted); }
    tbody tr[data-id].open { background:#152032; } tbody tr[data-id].open td:first-child::before { content:"▾"; color:var(--accent); }
    tr.detail-row > td { padding:0; border-bottom:1px solid #202c3e; white-space:normal; background:#0b121c; }
    tr.detail-row .detail-inner { padding:16px; }
    .success,.pass { color:var(--green); } .failed,.fail,.error { color:var(--red); } .running,.pending { color:var(--yellow); }
    .pill { display:inline-block; border:1px solid #33445e; border-radius:999px; padding:3px 8px; color:#c5d3e7; font-size:11px; }
    .compare { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px; max-width:560px; }
    .shot { border:1px solid var(--line); background:#09101a; border-radius:12px; padding:10px; display:grid; gap:8px; }
    .shot img { width:100%; max-height:260px; aspect-ratio:4/5; object-fit:contain; border-radius:8px; background:#05080d; }
    .detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .empty { padding:28px; text-align:center; color:var(--muted); border:1px dashed #304057; border-radius:12px; }
    @media(max-width:1100px){ .cards{grid-template-columns:repeat(4,1fr)} }
    @media(max-width:720px){ main{width:min(100% - 16px,1500px)} header{padding:14px} .cards{grid-template-columns:1fr 1fr} .form-grid,.compare,.detail-grid{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <header><div class="topline"><div><h1>生成歷史</h1><span class="muted">PersonaFlow Research Console</span></div><nav><a href="index.html">主操作頁</a>　<a href="projection.html">投影牆</a></nav></div></header>
  <main>
    <p class="notice">點一筆紀錄可直接在原地展開，內含輸入照片與生成結果的對照，方便檢查還原性。</p>
    <div class="cards">
      <div class="card"><span class="label">測試次數</span><strong class="value" id="runCount">—</strong></div>
      <div class="card"><span class="label">API請求</span><strong class="value" id="apiCount">—</strong></div>
      <div class="card"><span class="label">累計成本</span><strong class="value" id="cost">—</strong></div>
      <div class="card"><span class="label">總Token</span><strong class="value" id="tokens">—</strong></div>
      <div class="card"><span class="label">成功率</span><strong class="value" id="successRate">—</strong></div>
      <div class="card"><span class="label">已人工審查</span><strong class="value" id="reviewedCount">—</strong></div>
      <div class="card"><span class="label">人工通過率</span><strong class="value" id="reviewPassRate">—</strong></div>
      <div class="card"><span class="label">物種離散度<br><span class="muted" style="font-weight:400">線寬·軀幹</span></span><strong class="value" id="castDrift">—</strong></div>
    </div>
    <div class="panel" id="driftPanel" style="display:none">
      <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap">
        <strong>跨角色物種漂移</strong>
        <span class="muted">相對離散度 = 標準差／平均。越小代表越像同一個物種。</span>
        <button id="backfillDrift" style="margin-left:auto">量測歷史紀錄</button>
      </div>
      <div class="table-wrap" style="margin-top:10px"><table><thead><tr><th>部位</th><th>樣本</th><th>方向性明暗</th><th>線寬</th><th>印刷佔比</th><th>邊緣密度</th><th>飽和度</th></tr></thead><tbody id="driftRows"></tbody></table></div>
      <div class="muted" id="driftNote" style="margin-top:8px"></div>
    </div>
    <div class="panel" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <select id="modeFilter" style="max-width:230px"><option value="">全部模式</option><option value="full_character">full_character</option><option value="brick_ai_texture">已退役 brick_ai_texture</option><option value="body_sprite">已退役 body_sprite</option><option value="full_character_refined">已退役 refined</option><option value="external_import">外部匯入</option></select>
      <input id="experimentFilter" placeholder="實驗ID（留空顯示全部）" style="max-width:260px">
      <input id="variantFilter" placeholder="variant（留空顯示全部）" style="max-width:230px">
      <button id="refreshHistory">重新整理</button><span class="muted" id="updated"></span>
    </div>
    <div class="panel table-wrap"><table><thead><tr><th>時間</th><th>模式</th><th>模型</th><th>實驗／人物／variant</th><th>狀態</th><th>細節</th><th>人工審查</th><th>耗時</th><th>API</th><th>Token</th><th>成本USD</th><th>驗證問題</th></tr></thead><tbody id="historyRows"></tbody></table></div>
  </main>

  <script>
    const ORIGIN='http://127.0.0.1:5001', API=`${ORIGIN}/api/dev`;
    const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const money=v=>v==null?'未提供':`$${Number(v).toFixed(6)}`;
    const duration=v=>v==null?'—':`${(Number(v)/1000).toFixed(2)}s`;
    const api=async(path,options={})=>{const response=await fetch(`${API}${path}`,options);const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.detail||data.error||`HTTP ${response.status}`);return data};
    const formObject=form=>Object.fromEntries(new FormData(form).entries());
    const postJson=(path,body)=>api(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const scoreSelect=(name,label)=>`<label>${label}<select name="${name}" required><option value="">請評分</option>${[1,2,3,4,5].map(n=>`<option value="${n}">${n}</option>`).join('')}</select></label>`;

    let currentRuns=[], openId=null, openRow=null;

    async function loadHistory(){
      const query=new URLSearchParams({limit:'500'});if($('modeFilter').value)query.set('mode',$('modeFilter').value);if($('experimentFilter').value.trim())query.set('experiment_id',$('experimentFilter').value.trim());if($('variantFilter').value.trim())query.set('variant_id',$('variantFilter').value.trim());
      const driftQuery=new URLSearchParams();if($('experimentFilter').value.trim())driftQuery.set('experiment_id',$('experimentFilter').value.trim());
      const [summary,runs,drift]=await Promise.all([api('/summary'),api(`/generations?${query}`),api(`/cast-drift?${driftQuery}`).catch(()=>null)]);currentRuns=runs.items||[];
      $('runCount').textContent=summary.run_count||0;$('apiCount').textContent=summary.api_call_count||0;$('cost').textContent=money(summary.cost_usd);$('tokens').textContent=Number(summary.total_tokens||0).toLocaleString();$('successRate').textContent=`${(Number(summary.success_rate||0)*100).toFixed(1)}%`;$('reviewedCount').textContent=summary.reviewed_count||0;$('reviewPassRate').textContent=summary.reviewed_count?`${(summary.review_pass_count/summary.reviewed_count*100).toFixed(1)}%`:'—';
      $('historyRows').innerHTML=currentRuns.map(run=>`<tr data-id="${esc(run.request_id)}"><td>${new Date(run.created_at*1000).toLocaleString()}</td><td>${esc(run.mode)}</td><td>${esc(run.model||'—')}</td><td><span class="pill">${esc(run.experiment_id||'未分組')}</span><br>${esc(run.comparison_id||'—')} · ${esc(run.variant_id||'—')}</td><td class="${esc(run.status)}">${esc(run.status)}</td><td>${run.detail_metrics?.detail_score==null?'—':Number(run.detail_metrics.detail_score).toFixed(3)}</td><td>${esc(run.review_verdict||'pending')}${run.overall_score?` · ${run.overall_score}/5`:''}</td><td>${duration(run.duration_ms)}</td><td>${run.api_call_count}</td><td>${run.token_reported?Number(run.total_tokens).toLocaleString():'未提供'}</td><td>${money(run.cost_usd)}</td><td>${esc((run.validation_errors||[]).join(', ')||'—')}</td></tr>`).join('')||'<tr><td colspan="12" class="muted">沒有符合條件的紀錄</td></tr>';
      openId=null;openRow=null;
      document.querySelectorAll('#historyRows tr[data-id]').forEach(row=>row.onclick=()=>toggleHistoryDetail(row.dataset.id,row));
      $('updated').textContent=`更新 ${new Date().toLocaleTimeString()}`;
      renderDrift(drift);
    }
    const DRIFT_FEATURES=['directional_gradient','stroke_width_rel','mark_share','edge_density','saturation_median'];
    const REGION_LABEL={face:'臉',garment_torso:'軀幹',denim_leg:'腿',shoe:'鞋'};
    function spreadCell(stats){
      if(!stats||stats.relative_spread==null)return '<td class="muted">—</td>';
      const v=Number(stats.relative_spread);
      // >0.30 reads as visibly different art styles side by side.
      const colour=v>0.30?'#d73a49':(v>0.15?'#b08800':'#22863a');
      return `<td style="color:${colour}">${v.toFixed(2)}</td>`;
    }
    function renderDrift(drift){
      const panel=$('driftPanel');
      if(!drift||!drift.regions){panel.style.display='none';$('castDrift').textContent='—';return}
      panel.style.display='';
      const rows=[],notes=new Set();
      for(const [name,label] of Object.entries(REGION_LABEL)){
        const region=drift.regions[name];
        if(!region)continue;
        if(region.directional_gradient_confound)notes.add(`${label}：${region.directional_gradient_confound}`);
        if(!region.measurable){rows.push(`<tr><td>${label}</td><td>${region.characters||0}</td><td colspan="5" class="muted">樣本不足（需 2 個以上）</td></tr>`);continue}
        const cells=DRIFT_FEATURES.map(f=>spreadCell(region.features?.[f])).join('');
        rows.push(`<tr><td>${label}</td><td>${region.characters}</td>${cells}</tr>`);
      }
      $('driftRows').innerHTML=rows.join('')||'<tr><td colspan="7" class="muted">尚無可量測的角色</td></tr>';
      $('driftNote').textContent=notes.size?`注意 — ${[...notes].join('；')}`:'';
      const headline=drift.regions.garment_torso?.features?.stroke_width_rel?.relative_spread;
      $('castDrift').textContent=headline==null?'—':Number(headline).toFixed(2);
    }
    $('backfillDrift').onclick=async()=>{
      const button=$('backfillDrift');button.disabled=true;button.textContent='量測中…';
      try{const result=await postJson('/cast-drift/backfill',{});button.textContent=`已量測 ${result.updated} 筆`;await loadHistory()}
      catch(error){button.textContent=error.message}
      finally{setTimeout(()=>{button.disabled=false;button.textContent='量測歷史紀錄'},2500)}
    };

    async function toggleHistoryDetail(id,row){
      if(openId===id){closeDetail();return}
      closeDetail();
      const run=await api(`/generations/${encodeURIComponent(id)}`),review=run.review||{};
      const detailRow=document.createElement('tr');
      detailRow.className='detail-row';
      detailRow.innerHTML=`<td colspan="12"><div class="detail-inner">
        <div class="compare">
          <div class="shot"><span class="muted">輸入照片</span>${run.input_url?`<img src="${ORIGIN}${esc(run.input_url)}" alt="輸入照片">`:'<div class="empty">此紀錄未保存輸入照片</div>'}</div>
          <div class="shot"><span class="muted">生成結果</span>${run.output_url?`<img src="${ORIGIN}${esc(run.output_url)}" alt="生成結果">`:'<div class="empty">沒有保存最終圖</div>'}</div>
        </div>
        <p class="muted">Request ${esc(run.request_id)} · ${esc(run.mode)} · ${esc(run.model||'模型未提供')} · ${esc(run.status)}</p>
        <div class="detail-grid">
          <div>
            <h3>實驗配對</h3>
            <form id="metaForm" class="form-grid"><label>實驗ID<input name="experiment_id" value="${esc(run.experiment_id||'')}"></label><label>人物代碼<input name="comparison_id" value="${esc(run.comparison_id||'')}"></label><label>Variant<input name="variant_id" value="${esc(run.variant_id||'')}"></label><div class="wide" style="display:flex;align-items:center;gap:10px"><button class="primary">保存配對</button><span id="metaStatus" class="muted"></span></div></form>
            <h3>開發者快速審查</h3>
            <form id="quickReview" class="form-grid"><label>判定<select name="verdict"><option value="pending">待審</option><option value="pass" ${review.verdict==='pass'?'selected':''}>通過</option><option value="fail" ${review.verdict==='fail'?'selected':''}>不通過</option></select></label>${['completeness','clothing_match','face_match','overall'].map(key=>scoreSelect(`${key}_score`,{completeness:'肢體完整',clothing_match:'服裝相似',face_match:'臉髮相似',overall:'整體效果'}[key]).replace(`value=\"${review[`${key}_score`]}\"`,`value=\"${review[`${key}_score`]}\" selected`)).join('')}<label class="wide">備註<textarea name="notes">${esc(review.notes||'')}</textarea></label><div class="wide" style="display:flex;align-items:center;gap:10px"><button>保存快速審查</button><span id="quickStatus" class="muted"></span></div></form>
          </div>
          <div>
            <h3>API attempts</h3>
            <div class="table-wrap"><table><thead><tr><th>階段</th><th>模型</th><th>耗時</th><th>Token</th><th>成本</th><th>結果</th></tr></thead><tbody>${(run.attempts||[]).map(a=>`<tr><td>${esc(a.phase)}</td><td>${esc(a.model||'—')}</td><td>${duration(a.duration_ms)}</td><td>${a.total_tokens==null?'未提供':a.total_tokens}</td><td>${money(a.cost_usd)}</td><td>${a.ok?'OK':esc(a.error_code||'failed')}</td></tr>`).join('')}</tbody></table></div>
          </div>
        </div>
      </div></td>`;
      row.after(detailRow);
      row.classList.add('open');
      openId=id;openRow=row;
      detailRow.querySelector('#metaForm').onsubmit=async event=>{event.preventDefault();try{const result=await postJson(`/generations/${encodeURIComponent(id)}/experiment`,formObject(event.target));detailRow.querySelector('#metaStatus').textContent='已保存';const item=result.item;row.children[3].innerHTML=`<span class="pill">${esc(item.experiment_id||'未分組')}</span><br>${esc(item.comparison_id||'—')} · ${esc(item.variant_id||'—')}`}catch(error){detailRow.querySelector('#metaStatus').textContent=error.message}};
      detailRow.querySelector('#quickReview').onsubmit=async event=>{event.preventDefault();const body=formObject(event.target);['completeness_score','clothing_match_score','face_match_score','overall_score'].forEach(key=>body[key]=body[key]?Number(body[key]):null);try{const result=await postJson(`/generations/${encodeURIComponent(id)}/review`,body);detailRow.querySelector('#quickStatus').textContent='已保存';const savedReview=result.review||{};row.children[6].innerHTML=`${esc(savedReview.verdict||'pending')}${savedReview.overall_score?` · ${savedReview.overall_score}/5`:''}`}catch(error){detailRow.querySelector('#quickStatus').textContent=error.message}};
    }
    function closeDetail(){
      if(openRow)openRow.classList.remove('open');
      const existing=document.querySelector('tr.detail-row');
      if(existing)existing.remove();
      openId=null;openRow=null;
    }

    $('refreshHistory').onclick=()=>loadHistory().catch(showError);$('modeFilter').onchange=()=>loadHistory().catch(showError);
    function showError(error){$('updated').textContent=error.message}
    loadHistory().catch(showError);
  </script>
<script src="./branch-badge.js"></script>
</body>
</html>
