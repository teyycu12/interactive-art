<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PersonaFlow</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #111;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
      #model-selector {
        position: fixed;
        top: 118px;
        left: 32px;
        width: 240px;
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 12px;
        padding: 16px;
        color: #c9d1d9;
        font-family: system-ui, sans-serif;
        font-size: 13px;
        z-index: 30;
        display: flex;
        flex-direction: column;
        gap: 8px;
        box-sizing: border-box;
      }
      #model-selector.in-frame {
        justify-content: flex-start;
      }
      #model-selector .title {
        color: #f0f6fc;
        font-size: 16px;
        font-weight: 800;
      }
      #model-selector .hint { color: #8b949e; font-size: 11px; line-height: 1.4; }
      #model-selector select {
        width: 100%;
        padding: 9px 10px;
        border-radius: 8px;
        border: 1px solid #30363d;
        background: #0d1117;
        color: #c9d1d9;
        font-size: 13px;
      }
      @media (max-width: 1279px) {
        #model-selector {
          top: 86px;
          left: 20px;
          width: min(280px, calc(100vw - 40px));
          padding: 12px 14px;
        }
      }
      @media (max-height: 820px) {
        #model-selector {
          top: 104px;
          padding: 12px 14px;
        }
      }
      #dev-history-link {
        position: fixed;
        right: 20px;
        bottom: 20px;
        z-index: 20;
        padding: 9px 12px;
        border: 1px solid #30363d;
        border-radius: 7px;
        background: #21262d;
        color: #58a6ff;
        font: 13px system-ui, sans-serif;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div id="model-selector">
      <span class="title">生成模型</span>
      <span class="hint">選擇生成角色圖片的 AI 模型，會影響品質、速度與費用。</span>
      <select id="modelSelect">
        <option value="">伺服器預設</option>
        <option value="google/gemini-3-pro-image-preview">Gemini 3 Pro（高品質，較慢）</option>
        <option value="google/gemini-2.5-flash-image-preview">Gemini 2.5 Flash（較快）</option>
        <option value="google/gemini-3.1-flash-image">Gemini 3.1 Flash（較快）</option>
      </select>
    </div>
    <a id="dev-history-link" href="dev.html?v=20260823-history-accordion">生成歷史</a>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.3/lib/p5.min.js"></script>
    <script src="./character.js?v=20260718"></script>
    <script src="./themes/registry.js?v=20260718"></script>
    <script src="./themes/lego.js?v=20260803-no-cloth-grid"></script>
    <script src="./socket.js?v=20260718-final-render"></script>
    <script src="./sketch.js?v=20260822-full-character"></script>
    <script src="./branch-badge.js"></script>
  </body>
</html>
