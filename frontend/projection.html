<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>PersonaFlow — 投影展示牆</title>
  <script>
    window.onerror = function(msg, url, line) {
      const d = document.createElement('div');
      d.style.cssText = 'position:absolute;top:100px;left:20px;color:red;z-index:9999;background:white;padding:10px;border:1px solid red;font-size:14px;font-family:monospace;';
      d.innerHTML = 'JS Error: ' + msg + '<br>Line: ' + line;
      document.body.appendChild(d);
    };
  </script>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: #1a1a2e url('wedding_bg.png') no-repeat center center / cover;
      overflow: hidden;
      font-family: 'Helvetica Neue', sans-serif;
    }
    canvas { display: block; cursor: crosshair; }

    #ui-panel {
      position: absolute; top: 20px; right: 20px; width: 260px;
      background: rgba(255,255,255,0.85); backdrop-filter: blur(10px);
      border-radius: 12px; padding: 15px; z-index: 10;
      border: 1px solid rgba(255,255,255,0.8);
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
    }
    #ui-panel h2 { margin: 0 0 8px; font-size: 16px; color: #333; }
    #status-line { font-size: 12px; color: #666; margin-bottom: 10px; }
    .action-btn {
      width: 100%; padding: 10px; background: #58a6ff; color: #fff;
      border: none; border-radius: 6px; cursor: pointer; font-weight: bold;
      transition: background 0.2s; margin-top: 6px;
    }
    .action-btn:hover { background: #2ea043; }

    #coord-panel {
      position: absolute; bottom: 20px; left: 20px;
      background: rgba(0,0,0,0.7); color: #0f0; font-family: monospace;
      padding: 8px 12px; border-radius: 6px; z-index: 100; pointer-events: none;
      font-size: 12px;
    }
    #canvas-container { position: absolute; inset: 0; }

    /* 大合照結果覆蓋層：photo_ready 回來後顯示成品與 QR Code */
    #photo-overlay {
      position: absolute; inset: 0; z-index: 200;
      background: rgba(10, 12, 20, 0.92);
      display: none; align-items: center; justify-content: center;
      flex-direction: column; gap: 16px; padding: 32px;
    }
    #photo-overlay.visible { display: flex; }
    #photo-overlay img#photo-result {
      max-width: 82vw; max-height: 66vh; object-fit: contain;
      border-radius: 8px; box-shadow: 0 8px 40px rgba(0,0,0,0.6);
      background: #000;
    }
    #photo-meta {
      display: flex; align-items: center; gap: 20px;
      background: rgba(255,255,255,0.94); border-radius: 12px;
      padding: 14px 18px; color: #222;
    }
    #photo-meta img { width: 116px; height: 116px; display: block; }
    #photo-meta .txt { font-size: 14px; line-height: 1.6; }
    #photo-meta .txt strong { display: block; font-size: 16px; margin-bottom: 4px; }
    #photo-meta .txt code {
      font-family: monospace; font-size: 12px; color: #555;
      word-break: break-all;
    }
    #photo-hint { color: #aab; font-size: 13px; }
    #photo-overlay.pending #photo-meta,
    #photo-overlay.pending #photo-result { display: none; }
    #photo-overlay .spinner { color: #dde; font-size: 15px; display: none; }
    #photo-overlay.pending .spinner { display: block; }
  </style>

  <!-- PixiJS v6 -->
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"></script>
  <!-- Socket.io (must match PersonaFlow backend version) -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>

<div id="ui-panel">
  <h2>PersonaFlow 投影牆</h2>
  <div id="status-line">等待 Socket.io 連線…</div>
  <button id="photoBtn" class="action-btn">📸 集合大合照</button>
  <button id="addBotsBtn" class="action-btn" style="background:#2ea043;">🤖 注入模擬角色 (+5)</button>
  <button id="clearBtn" class="action-btn" style="background:#da3633;">🗑 清除全部角色</button>
</div>

<div id="coord-panel">Screen: (0, 0) | Original: (0, 0)</div>
<div id="photo-overlay">
  <div class="spinner">正在合成大合照…</div>
  <img id="photo-result" alt="集體記憶紀念大合照">
  <div id="photo-meta">
    <img id="photo-qr" alt="下載用 QR Code">
    <div class="txt">
      <strong>掃描 QR Code 下載合照</strong>
      <span id="photo-count"></span><br>
      <code id="photo-url"></code>
    </div>
  </div>
  <div id="photo-hint">按 Esc 或點擊任意處關閉</div>
</div>

<div id="canvas-container"></div>

<script>
// ─── 1. 基礎向量 ──────────────────────────────────────────────────────────────
class Vec2 {
  constructor(x, y) { this.x = x || 0; this.y = y || 0; }
  add(v) { this.x += v.x; this.y += v.y; return this; }
  sub(v) { this.x -= v.x; this.y -= v.y; return this; }
  mult(n) { this.x *= n; this.y *= n; return this; }
  div(n) { if (n !== 0) { this.x /= n; this.y /= n; } return this; }
  magSq() { return this.x * this.x + this.y * this.y; }
  mag() { return Math.sqrt(this.magSq()); }
  normalize() { const m = this.mag(); if (m > 0) this.div(m); return this; }
  limit(max) { if (this.magSq() > max * max) { this.normalize(); this.mult(max); } return this; }
  dist(v) { return Math.sqrt((this.x - v.x) ** 2 + (this.y - v.y) ** 2); }
  static sub(v1, v2) { return new Vec2(v1.x - v2.x, v1.y - v2.y); }
}

// ─── 2. 全域狀態 ──────────────────────────────────────────────────────────────
const flock = [];
const boidMap = {};   // charId → Boid
let isPhotoTime = false;
const USE_SERVER_POSITIONS = false; // 設為 true 啟用伺服器座標權威插值
let _lastUpdatePositionsTs = performance.now();
const STALE_THRESHOLD_MS = 2500;   // 超過此時間沒收到 update_positions 視為訊號中斷
let _staleWarned = false;          // 避免每幀重寫 DOM，並支援恢復後自動回復狀態
let pixiApp;

// 背景尺寸（配合你的背景圖調整）
const BG_W = 1264, BG_H = 848;

// ─── 3. 背景縮放 ──────────────────────────────────────────────────────────────
function resizeForegrounds() {
  if (!window.foregroundSprites) return;
  const scale = Math.max(window.innerWidth / BG_W, window.innerHeight / BG_H);
  const x = (window.innerWidth  - BG_W * scale) / 2;
  const y = (window.innerHeight - BG_H * scale) / 2;
  window.bgTransform = { scale, x, y };
  window.foregroundSprites.forEach(sprite => {
    sprite.scale.set(scale);
    sprite.x = x; sprite.y = y;
    sprite.zIndex = y + sprite.baseY * scale;
  });
}

// ─── 4. 地板邊界（wedding_bg.png 1264×848 原始座標，移植自 boids_concept.html）
function getFloorBounds(y_orig) {
  const min_y = 250, max_y = 650; // 650 以下是暗色深淵，不讓角色走進去
  let x_left, x_right;

  if (y_orig < 500)       x_left = 560 - 1.64 * (y_orig - 250);
  else if (y_orig < 600)  x_left = 150 - 0.5  * (y_orig - 500);
  else                    x_left = 100 + 3.0  * (y_orig - 600);

  if (y_orig < 360)       x_right = 560 + 1.27 * (y_orig - 250);
  else if (y_orig < 600)  x_right = 700 + 1.15 * (y_orig - 360);
  else                    x_right = 917 - 2.5  * (y_orig - 600);

  if (x_left > x_right) { const mid = (x_left + x_right) / 2; x_left = mid; x_right = mid; }
  x_left  = Math.max(150, x_left);
  x_right = Math.min(1100, x_right);
  return { minX: x_left, maxX: x_right, minY: min_y, maxY: max_y };
}

// ─── 5. LEGO 角色類別（移植自 boids_concept.html）────────────────────────────
class LegoCharacter extends PIXI.Container {
  constructor(topColor = 0xC81E1E, bottomColor = 0x2A52BE, armColor = null) {
    super();
    this.topColor    = topColor;
    this.bottomColor = bottomColor;
    this.armColor    = armColor; // null = same as topColor
    this.skinColor   = 0xFFCC00;

    this.inner = new PIXI.Container();
    this.inner.scale.set(2.5);
    this.inner.sortableChildren = true;
    this.addChild(this.inner);

    this.walkPhase = 0;
    this.legGap    = 1.5;
    this.legW      = 21;
    this.torsoH    = 50;
    this.shoulderOffsetX = 19;
    this.shoulderY = -this.torsoH / 2 + 2;

    this.leftLeg  = this._createLeg();  this.leftLeg.x  = -this.legW / 2 - this.legGap;  this.leftLeg.y  = this.torsoH / 2;
    this.rightLeg = this._createLeg();  this.rightLeg.x =  this.legW / 2 + this.legGap;  this.rightLeg.y = this.torsoH / 2;
    this.body     = this._createBody(); this.body.zIndex = 3;
    this.leftArm  = this._createArm();  this.leftArm.x  = -this.shoulderOffsetX; this.leftArm.y = this.shoulderY;
    this.rightArm = this._createArm();  this.rightArm.x =  this.shoulderOffsetX; this.rightArm.y = this.shoulderY;
    this.head     = this._createHead(); this.head.zIndex = 6;
    this.glasses  = this._createGlasses(); this.glasses.zIndex = 7; this.glasses.visible = false;

    this.inner.addChild(this.leftLeg, this.rightLeg, this.body,
                        this.leftArm, this.rightArm, this.head, this.glasses);
    this._buildClothGridOverlay();
    this._buildAccContainers();
    this.updateColors(this.topColor, this.bottomColor);
  }

  // ── Cloth-grid overlay (zIndex 3.5 – above body fill, below arms/head) ─────
  _buildClothGridOverlay() {
    // Body overlay only — trapezoid mask matching body shape in inner units
    // (tTop/2=19, tBottom/2=25, torsoH/2=25)
    this._clothGfx  = new PIXI.Graphics(); this._clothGfx.zIndex = 3.5;
    this._clothMask = new PIXI.Graphics();
    this._clothMask.beginFill(0xFFFFFF);
    this._clothMask.moveTo(-19,-25); this._clothMask.lineTo(19,-25);
    this._clothMask.lineTo(25,25);   this._clothMask.lineTo(-25,25);
    this._clothMask.closePath(); this._clothMask.endFill();
    this._clothGfx.mask = this._clothMask;
    this.inner.addChild(this._clothGfx, this._clothMask);

    // Body outline above the cloth-grid layer — fixed 0xBBBBBB so it stays
    // visible even when topColor is very dark (tint would make black outline invisible).
    this._bodyOutline = new PIXI.Graphics();
    this._bodyOutline.zIndex = 3.6;
    this._bodyOutline.beginFill(0, 0); this._bodyOutline.lineStyle(1.5, 0xBBBBBB);
    this._bodyOutline.moveTo(-19,-25); this._bodyOutline.lineTo(19,-25);
    this._bodyOutline.lineTo(25,25);   this._bodyOutline.lineTo(-25,25);
    this._bodyOutline.closePath(); this._bodyOutline.endFill();
    this.inner.addChild(this._bodyOutline);

    // _lowerGfx intentionally removed — per-leg grid causes z-index/outline conflicts.
    // Legs use flat tinted color + always-visible outline instead (see _createLeg).
    this._lowerGfx = null;
  }

  updateClothGrid(grid) {
    if (!this._clothGfx) return;
    this._clothGfx.clear();
    if (!grid || !grid.cells || grid.cells.length === 0) return;
    const { cols, rows, cells } = grid;
    for (let row = 0; row < rows; row++) {
      const v1 = row / rows, v2 = (row + 1) / rows;
      const y1 = -25 + v1 * 50, y2 = -25 + v2 * 50;
      const w1 = 38 + 12 * v1, w2 = 38 + 12 * v2;  // trapezoid width interpolation
      for (let col = 0; col < cols; col++) {
        const cell = cells[row * cols + col];
        if (!cell || !cell.active) continue;
        const u1 = col / cols, u2 = (col + 1) / cols;
        const x1t = -w1/2 + u1*w1, x2t = -w1/2 + u2*w1;
        const x1b = -w2/2 + u1*w2, x2b = -w2/2 + u2*w2;
        this._clothGfx.beginFill((cell.r << 16) | (cell.g << 8) | cell.b);
        this._clothGfx.lineStyle(0);
        this._clothGfx.drawPolygon([x1t,y1, x2t,y1, x2b,y2, x1b,y2]);
        this._clothGfx.endFill();
      }
    }
  }

  updateLowerGrid(_grid) { /* disabled – leg grid causes z-index/outline conflicts */ }

  _createLeg() {
    const c = new PIXI.Container();
    // Fill: white with no outline — receives tint for actual leg color.
    const fill = new PIXI.Graphics();
    fill.beginFill(0xFFFFFF); fill.lineStyle(0);
    fill.drawRect(-10.5, 0, 21, 38);
    fill.drawRoundedRect(-11.5, 38, 23, 10, 2);
    fill.endFill();
    // Outline: no fill, fixed light-gray line — NOT tinted, always visible
    // even against very dark (near-black) pants. Mirrors lego.js legOutline logic.
    const outline = new PIXI.Graphics();
    outline.beginFill(0, 0); outline.lineStyle(1.5, 0xBBBBBB);
    outline.drawRect(-10.5, 0, 21, 38);
    outline.drawRoundedRect(-11.5, 38, 23, 10, 2);
    outline.endFill();
    c.addChild(fill, outline);
    c.base = fill;  // tint target
    return c;
  }

  _createArm() {
    const c = new PIXI.Container();
    // Fill: white, no outline — receives tint.
    const sleeveFill = new PIXI.Graphics();
    sleeveFill.beginFill(0xFFFFFF); sleeveFill.lineStyle(0);
    sleeveFill.drawRoundedRect(-6.5, 0, 13, 40, 5); sleeveFill.endFill();
    // Outline: fixed gray — visible on both dark and light sleeves.
    const sleeveOutline = new PIXI.Graphics();
    sleeveOutline.beginFill(0, 0); sleeveOutline.lineStyle(1.5, 0xBBBBBB);
    sleeveOutline.drawRoundedRect(-6.5, 0, 13, 40, 5); sleeveOutline.endFill();
    const hand = new PIXI.Graphics();
    hand.beginFill(this.skinColor); hand.lineStyle(1.5, 0x444444);
    const rIn = 5, rOut = 10;
    hand.moveTo(rOut * Math.cos(Math.PI), rOut * Math.sin(Math.PI) + 45);
    for (let a = 180; a <= 360; a += 10) hand.lineTo(rOut * Math.cos(a * Math.PI / 180), rOut * Math.sin(a * Math.PI / 180) + 45);
    for (let a = 360; a >= 180; a -= 10) hand.lineTo(rIn  * Math.cos(a * Math.PI / 180), rIn  * Math.sin(a * Math.PI / 180) + 45);
    hand.closePath(); hand.endFill();
    c.addChild(sleeveFill, sleeveOutline, hand);
    c.base = sleeveFill;  // tint target
    return c;
  }

  _createBody() {
    // Must stay as Graphics so this.body.tint works. Fill only — outline
    // is drawn as a separate _bodyOutline Graphics inside _buildClothGridOverlay
    // (zIndex 3.6, above the cloth-grid layer) so it stays visible on dark shirts.
    const g = new PIXI.Graphics();
    g.beginFill(0xFFFFFF); g.lineStyle(0);
    g.moveTo(-19,-25); g.lineTo(19,-25); g.lineTo(25,25); g.lineTo(-25,25); g.endFill();
    return g;
  }

  _createHead() {
    const c = new PIXI.Container();
    const hs = new PIXI.Graphics();
    hs.beginFill(this.skinColor); hs.lineStyle(1.5, 0x000000);
    hs.drawRect(-8, -29, 16, 4);
    hs.drawRoundedRect(-19.25, -64, 38.5, 35, 8);
    hs.drawRoundedRect(-9, -70.5, 18, 7, 2); hs.endFill();
    const face = new PIXI.Graphics();
    face.beginFill(0x000000);
    face.drawCircle(-8, -48, 2.5); face.drawCircle(8, -48, 2.5); face.endFill();
    face.lineStyle(1.5, 0x000000);
    face.moveTo(-6, -42); face.quadraticCurveTo(0, -38, 6, -42);
    face.x = 4;
    c.addChild(hs, face); return c;
  }

  _createGlasses() {
    const g = new PIXI.Graphics();
    g.beginFill(0x33CCFF, 0.7); g.lineStyle(1.5, 0x000000);
    g.drawRoundedRect(-16, -56, 32, 12, 4); g.endFill();
    g.lineStyle(2, 0x333333);
    g.moveTo(-16,-50); g.lineTo(-20,-50);
    g.moveTo(16,-50);  g.lineTo(20,-50);
    return g;
  }

  // ── Accessory creators (inner-unit coords, scale factor vs p5 = 1/1.5 ≈ 0.667) ──

  _accHat() {
    const g = new PIXI.Graphics();
    g.beginFill(0x231909); g.lineStyle(1.5, 0x5a3a29);
    g.drawRect(-17, -89, 34, 25);   // crown
    g.drawEllipse(0, -64, 29, 5);   // brim
    g.endFill();
    g.beginFill(0xC83232); g.lineStyle(0);
    g.drawRect(-17, -79, 34, 5);    // band
    g.endFill();
    g.zIndex = 8; return g;
  }

  _accGlasses() {
    const g = new PIXI.Graphics();
    g.lineStyle(2, 0x141414);
    g.beginFill(0xFFFFFF, 0.25);
    g.drawRoundedRect(-24, -54, 19, 13, 3);  // left lens
    g.drawRoundedRect(5,   -54, 19, 13, 3);  // right lens
    g.endFill();
    g.lineStyle(2, 0x141414);
    g.moveTo(-5, -47); g.lineTo(5, -47);     // bridge
    g.moveTo(-24, -49); g.lineTo(-30, -55);  // left temple
    g.moveTo(24,  -49); g.lineTo(30,  -55);  // right temple
    g.zIndex = 7; return g;
  }

  _accBouquet() {
    const c = new PIXI.Container(); c.x = -23; c.y = 15;
    const g = new PIXI.Graphics();
    g.lineStyle(2, 0x2D7A2D);
    g.moveTo(0, 18); g.lineTo(-4, 5);
    g.moveTo(0, 18); g.lineTo(4, 5);
    const fs = [[0,-3,0xFF5078],[- 9,1,0xFFC840],[9,1,0xC864FF],[-5,-12,0xFF96B4],[5,-12,0x64C8FF]];
    for (const [fx, fy, fc] of fs) {
      g.beginFill(fc); g.lineStyle(0); g.drawCircle(fx, fy, 7); g.endFill();
      g.beginFill(0xFFFFAA); g.drawCircle(fx, fy, 2.5); g.endFill();
    }
    g.beginFill(0xFFF0DC, 0.7); g.lineStyle(0.7, 0xC8B4A0, 0.6);
    g.drawEllipse(0, 14, 8, 4); g.endFill();
    c.addChild(g); c.zIndex = 5; return c;
  }

  _accCamera() {
    const c = new PIXI.Container(); c.x = 20; c.y = 11;
    const g = new PIXI.Graphics();
    g.beginFill(0x282828); g.lineStyle(1.5, 0x505050);
    g.drawRoundedRect(-9, -7, 18, 14, 2); g.endFill();
    g.beginFill(0x141432); g.lineStyle(1.5, 0x6496FF, 0.8);
    g.drawCircle(0, 1, 5); g.endFill();
    g.beginFill(0x3C64C8, 0.7); g.lineStyle(0);
    g.drawCircle(0, 1, 3); g.endFill();
    g.beginFill(0xFFFF96); g.drawRect(5, -7, 4, 3); g.endFill();
    g.lineStyle(1.5, 0xA06432, 0.6);
    g.moveTo(-9, -4); g.bezierCurveTo(-18, -15, -15, -29, -8, -32);
    c.addChild(g); c.zIndex = 5; return c;
  }

  _accBag() {
    const c = new PIXI.Container(); c.x = 25; c.y = 20;
    const g = new PIXI.Graphics();
    g.beginFill(0xAF7337); g.lineStyle(1.5, 0x5a3a29);
    g.drawRoundedRect(-8, -9, 16, 19, 3); g.endFill();
    g.beginFill(0x9B5F2D); g.lineStyle(1.5, 0x5a3a29);
    g.drawRoundedRect(-8, -9, 16, 8, 3); g.endFill();
    g.beginFill(0xDCBE50); g.lineStyle(0);
    g.drawCircle(0, -3, 2.5); g.endFill();
    g.lineStyle(2, 0x9B5F2D, 0.6);
    g.moveTo(-8, -5); g.bezierCurveTo(-20, -18, -19, -38, -10, -40);
    c.addChild(g); c.zIndex = 4; return c;
  }

  _accCat() {
    const c = new PIXI.Container(); c.x = -30; c.y = 22;
    const g = new PIXI.Graphics();
    g.beginFill(0xF0F0F0); g.lineStyle(1.5, 0x5a3a29);
    g.drawEllipse(0, 0, 11, 8);      // body
    g.drawEllipse(0, -13, 9, 7);     // head
    g.drawPolygon([-7,-18,-10,-26,-2,-18]);  // left ear
    g.drawPolygon([7,-18,10,-26,2,-18]);     // right ear
    g.endFill();
    g.beginFill(0x282828); g.lineStyle(0);
    g.drawCircle(-3, -14, 1.5); g.drawCircle(3, -14, 1.5); g.endFill();
    g.lineStyle(1, 0xF090A0);
    g.moveTo(0,-12); g.lineTo(-4,-10);
    g.moveTo(0,-12); g.lineTo(4,-10);
    c.addChild(g); c.zIndex = 4; return c;
  }

  _buildAccContainers() {
    this._acc = {
      hat:     this._accHat(),
      glasses: this._accGlasses(),
      bouquet: this._accBouquet(),
      camera:  this._accCamera(),
      bag:     this._accBag(),
      cat:     this._accCat(),
    };
    for (const node of Object.values(this._acc)) {
      node.visible = false;
      this.inner.addChild(node);
    }
  }

  updateAccessories(list) {
    if (!this._acc) return;
    const active = new Set(Array.isArray(list) ? list : []);
    for (const [key, node] of Object.entries(this._acc)) {
      node.visible = active.has(key);
    }
    // Legacy glasses (the simple blue rect) — hide when new acc system has glasses
    if (this.glasses) this.glasses.visible = false;
  }

  _darken(hex) {
    const r = Math.floor(((hex >> 16) & 0xFF) * 0.6);
    const g = Math.floor(((hex >>  8) & 0xFF) * 0.6);
    const b = Math.floor(( hex        & 0xFF) * 0.6);
    return (r << 16) | (g << 8) | b;
  }

  updateColors(topColor, bottomColor, armColor) {
    if (topColor    !== undefined) this.topColor    = topColor;
    if (bottomColor !== undefined) this.bottomColor = bottomColor;
    if (armColor    !== undefined) this.armColor    = armColor;
    // Apply tints immediately
    this.body.tint = this.topColor;
    const ac = (this.armColor !== null && this.armColor !== undefined) ? this.armColor : this.topColor;
    this.leftArm.base.tint  = ac;
    this.rightArm.base.tint = ac;
    this.leftLeg.base.tint  = this.bottomColor;
    this.rightLeg.base.tint = this.bottomColor;
  }

  /**
   * Apply real clothing pattern textures to body and legs.
   * clothGridTex / lowerGridTex are PIXI.Texture created by _gridToTexture().
   */
  applyGridTextures(clothGridTex, lowerGridTex) {
    if (clothGridTex) {
      if (this._bodyOverlay) { this.inner.removeChild(this._bodyOverlay); this.inner.removeChild(this._bodyMask); }
      const sprite = new PIXI.Sprite(clothGridTex);
      sprite.width = 50; sprite.height = 50;
      sprite.anchor.set(0.5, 0.5);
      sprite.x = 0; sprite.y = 0; sprite.zIndex = 3.5;
      const mask = new PIXI.Graphics();
      mask.beginFill(0xFFFFFF);
      mask.moveTo(-19, -25); mask.lineTo(19, -25);
      mask.lineTo(25, 25); mask.lineTo(-25, 25);
      mask.closePath(); mask.endFill();
      this.inner.addChild(mask);
      sprite.mask = mask;
      this.inner.addChild(sprite);
      this._bodyOverlay = sprite;
      this._bodyMask = mask;
      this.body.alpha = 0;  // hide solid fill behind the texture
    }
    if (lowerGridTex) {
      [this.leftLeg, this.rightLeg].forEach(leg => {
        if (leg._overlay) { leg.removeChild(leg._overlay); leg.removeChild(leg._overlayMask); }
        const s = new PIXI.Sprite(lowerGridTex);
        s.width = 21; s.height = 38;
        s.x = -10.5; s.y = 0; s.zIndex = 1;
        const m = new PIXI.Graphics();
        m.beginFill(0xFFFFFF);
        m.drawRect(-10.5, 0, 21, 38);
        m.endFill();
        leg.addChild(m); s.mask = m; leg.addChild(s);
        leg._overlay = s; leg._overlayMask = m;
        leg.base.alpha = 0;
      });
    }
  }

  updateAnimation(isWalking, isMovingRight, _time, isGreeting = false, speedMag = 1.0) {
    if (isWalking) this.walkPhase += speedMag * 0.10;
    const swing    = isWalking ? Math.sin(this.walkPhase) : 0;
    const armAngle = (18 * Math.PI / 180) * swing;
    const legAngle = (20 * Math.PI / 180) * swing;

    this.head.scale.x = isMovingRight ? 1 : -1;
    if (this.glasses) this.glasses.scale.x = this.head.scale.x;
    const leftFront = isMovingRight;

    const ac = this.armColor !== null && this.armColor !== undefined ? this.armColor : this.topColor;
    if (leftFront) {
      this.leftArm.zIndex  = 5; this.leftLeg.zIndex  = 4;
      this.rightArm.zIndex = 1; this.rightLeg.zIndex = 2;
      this.leftArm.base.tint  = ac;                    this.leftLeg.base.tint  = this.bottomColor;
      this.rightArm.base.tint = this._darken(ac);      this.rightLeg.base.tint = this._darken(this.bottomColor);
    } else {
      this.leftArm.zIndex  = 1; this.leftLeg.zIndex  = 2;
      this.rightArm.zIndex = 5; this.rightLeg.zIndex = 4;
      this.rightArm.base.tint = ac;                    this.rightLeg.base.tint = this.bottomColor;
      this.leftArm.base.tint  = this._darken(ac);      this.leftLeg.base.tint  = this._darken(this.bottomColor);
    }
    this.body.tint = this.topColor;

    const lerp = 0.18;
    const idle  = 15 * Math.PI / 180;
    let tLA, tRA, tLL, tRL;
    if (isWalking) {
      tLA =  armAngle; tRA = -armAngle; tLL = -legAngle; tRL = legAngle;
    } else {
      tLL = 0; tRL = 0;
      tLA = isMovingRight ?  idle : 0;
      tRA = isMovingRight ?  0    : -idle;
    }
    this.leftArm.rotation  += (tLA - this.leftArm.rotation)  * lerp;
    this.rightArm.rotation += (tRA - this.rightArm.rotation) * lerp;
    this.leftLeg.rotation  += (tLL - this.leftLeg.rotation)  * lerp;
    this.rightLeg.rotation += (tRL - this.rightLeg.rotation) * lerp;
    this.inner.y = isWalking ? -Math.abs(Math.sin(this.walkPhase)) * 3 : 0;
  }
}

// ─── 6. Boid 類別 ────────────────────────────────────────────────────────────
class Boid {
  constructor(x, y, characterDisplay, charId = null) {
    this.pos = new Vec2(x, y);
    this.vel = new Vec2((Math.random() * 2 - 1), (Math.random() * 2 - 1)).normalize().mult(1.0);
    this.acc = new Vec2(0, 0);
    this.charId = charId;
    this.photoTarget = null;
    this.serverTarget = null;
    this.serverState = 'ROAMING';
    this.walkTimer   = Math.random() * 200 + 100;
    this.restTimer   = 0;
    this.turnCooldown = 0;
    this.isWalkingToGreet = false;
    this.greetingTargetPos = null;
    this.greetPartner = null;
    this.lastGreetPartner = null;
    this.ignorePartnerTimer = 0;

    this.container = new PIXI.Container();
    this.shadow = new PIXI.Graphics();
    this.shadow.y = 75;
    for (let i = 0; i < 6; i++) {
      this.shadow.beginFill(0x000000, 0.08);
      this.shadow.drawEllipse(0, 0, 45 - i * 3, 12 - i * 0.8);
      this.shadow.endFill();
    }
    this.characterDisplay = characterDisplay;
    this.characterDisplay.scale.set(0.4);
    this.characterDisplay.x = 0; this.characterDisplay.y = 0;
    this.container.addChild(this.shadow, this.characterDisplay);
    this.container.x = x; this.container.y = y;
    pixiApp.stage.addChild(this.container);
  }

  startGreeting(target) {
    this.turnCooldown = 120;
    this.vel.mult(0); this.acc.mult(0);
    this.lastGreetPartner = target;
    this.ignorePartnerTimer = 600;
  }

  update() {
    if (this.turnCooldown > 0) this.turnCooldown--;
    if (this.ignorePartnerTimer > 0) {
      this.ignorePartnerTimer--;
      if (this.ignorePartnerTimer <= 0) this.lastGreetPartner = null;
    }

    const isTurning = this.turnCooldown > 0;

    if (USE_SERVER_POSITIONS && this.serverTarget) {
      const diff = Vec2.sub(this.serverTarget, this.pos);
      const dist = diff.mag();
      if (dist > 1.0) {
        this.vel = diff.mult(0.15);
        this.pos.add(this.vel);
      } else {
        this.pos.x = this.serverTarget.x;
        this.pos.y = this.serverTarget.y;
        this.vel.mult(0);
      }
      if (this.serverState === 'GREETING' && this.turnCooldown <= 0) {
        this.startGreeting(null);
      }
    } else if (isPhotoTime && this.photoTarget) {
      const diff = Vec2.sub(this.photoTarget, this.pos);
      if (diff.mag() > 2) {
        this.vel = diff.normalize().mult(3.5);
        this.pos.add(this.vel);
      } else {
        this.pos.x = this.photoTarget.x; this.pos.y = this.photoTarget.y;
        this.vel.mult(0);
      }
    } else if (this.isWalkingToGreet) {
      const dist = this.pos.dist(this.greetingTargetPos);
      if (dist < 2) {
        this.pos.x = this.greetingTargetPos.x; this.pos.y = this.greetingTargetPos.y;
        this.isWalkingToGreet = false;
        this.startGreeting(this.greetPartner);
        this.greetPartner = null;
      } else {
        this.vel = Vec2.sub(this.greetingTargetPos, this.pos).normalize().mult(1.0);
        this.pos.add(this.vel);
      }
    } else {
      if (isTurning) {
        this.vel.mult(0); this.acc.mult(0);
      } else {
        for (const other of flock) {
          if (other === this) continue;
          const diff = Vec2.sub(this.pos, other.pos);
          const d = diff.mag();
          if (d > 0 && d < 80) {
            if (this.greetPartner !== other) this.acc.add(diff.normalize().mult(0.1));
            const otherBusy = other.turnCooldown > 0 || other.isWalkingToGreet;
            if (!isTurning && !this.isWalkingToGreet && !otherBusy &&
                Math.abs(this.pos.y - other.pos.y) < 40 &&
                this.lastGreetPartner !== other && other.lastGreetPartner !== this) {
              const mx = (this.pos.x + other.pos.x) / 2;
              const my = (this.pos.y + other.pos.y) / 2;
              const tX = this.pos.x <= other.pos.x ? mx - 35 : mx + 35;
              const oX = this.pos.x <= other.pos.x ? mx + 35 : mx - 35;
              this.isWalkingToGreet = true;
              this.greetingTargetPos = new Vec2(tX, my);
              this.greetPartner = other;
              other.isWalkingToGreet = true;
              other.greetingTargetPos = new Vec2(oX, my);
              other.greetPartner = this;
            }
          }
        }
        if (this.vel.mag() < 0.1 && this.restTimer <= 0) {
          this.walkTimer = Math.random() * 200 + 100;
          this.vel = new Vec2(Math.random() * 2 - 1, Math.random() * 2 - 1).normalize().mult(1.0);
        }
      }
    }

    if (!isTurning && !this.isWalkingToGreet && !isPhotoTime) {
      if (this.restTimer > 0) {
        this.restTimer--;
        this.vel.mult(0.85);
        if (this.restTimer <= 0) {
          this.walkTimer = Math.random() * 200 + 100;
          this.vel = new Vec2(Math.random() * 2 - 1, Math.random() * 2 - 1).normalize().mult(1.0);
        }
      } else {
        this.walkTimer--;
        if (this.walkTimer <= 0) this.restTimer = 120;
      }

      if (window.bgTransform) {
        const bg = window.bgTransform;
        const origY = (this.pos.y - bg.y) / bg.scale;
        const origX = (this.pos.x - bg.x) / bg.scale;
        const bounds = getFloorBounds(origY);
        const margin = 40;
        const avoid  = new Vec2(0, 0);
        if (origX < bounds.minX + margin) avoid.x += (bounds.minX + margin - origX) * 0.02;
        if (origX > bounds.maxX - margin) avoid.x -= (origX - (bounds.maxX - margin)) * 0.02;
        if (origY < bounds.minY + margin) avoid.y += (bounds.minY + margin - origY) * 0.02;
        if (origY > bounds.maxY - margin) avoid.y -= (origY - (bounds.maxY - margin)) * 0.02;
        this.acc.add(avoid);
      }

      this.vel.add(this.acc);
      if (this.restTimer <= 0) this.vel.limit(1.3);
      this.pos.add(this.vel);
      this.acc.mult(0);

      if (window.bgTransform) {
        const bg = window.bgTransform;
        let origY = (this.pos.y - bg.y) / bg.scale;
        let origX = (this.pos.x - bg.x) / bg.scale;
        let bounds = getFloorBounds(origY);
        if (origY < bounds.minY) { origY = bounds.minY; this.vel.y =  Math.abs(this.vel.y); }
        if (origY > bounds.maxY) { origY = bounds.maxY; this.vel.y = -Math.abs(this.vel.y); }
        bounds = getFloorBounds(origY);
        if (origX < bounds.minX) { origX = bounds.minX; this.vel.x =  Math.abs(this.vel.x); if (origY > 550) this.vel.y = -Math.abs(this.vel.y); }
        if (origX > bounds.maxX) { origX = bounds.maxX; this.vel.x = -Math.abs(this.vel.x); if (origY > 550) this.vel.y = -Math.abs(this.vel.y); }
        this.pos.x = origX * bg.scale + bg.x;
        this.pos.y = origY * bg.scale + bg.y;
      }
    }

    this.container.x = this.pos.x;
    this.container.y = this.pos.y;

    if (window.bgTransform) {
      const bg    = window.bgTransform;
      const origY = (this.pos.y - bg.y) / bg.scale;
      const tD    = Math.max(0, Math.min(1, (origY - 150) / (800 - 150)));
      this.container.zIndex = origY;
      this.container.scale.set((0.5 + 0.6 * tD) * bg.scale);
    } else {
      this.container.zIndex = this.pos.y;
    }

    const isMovingRight = this.vel.x >= 0;
    const facing = isTurning && this.lastGreetPartner
      ? (this.lastGreetPartner.pos.x - this.pos.x) > 0
      : this.isWalkingToGreet && this.greetingTargetPos
        ? (this.greetingTargetPos.x - this.pos.x) > 0
        : isMovingRight;
    const speedMag  = this.vel.mag();
    const isWalking = speedMag > 0.1;
    this.characterDisplay.updateAnimation(isWalking, facing, pixiApp.ticker.lastTime, isTurning, speedMag);
  }

  destroy() {
    pixiApp.stage.removeChild(this.container);
    this.container.destroy({ children: true });
  }
}

// ─── 7. Socket.io 整合 ───────────────────────────────────────────────────────
const _host = window.location.hostname || '127.0.0.1';
const BACKEND_URL = `http://${_host}:5001`;
let socket = null;
const statusEl = document.getElementById('status-line');

function _hexToPixi(hex) {
  if (!hex || typeof hex !== 'string') return null;
  return parseInt(hex.replace('#', ''), 16);
}

function _safeHex(hex) {
  const v = _hexToPixi(hex);
  return (v === null || v === undefined || Number.isNaN(v)) ? null : v;
}

/**
 * Convert backend grid data ({cols, rows, cells:[{r,g,b}]}) into a PIXI.Texture.
 * Each grid cell = 1 pixel; PixiJS scales it to fill the body/leg shape with NEAREST
 * sampling so you get crisp pixel-art style patterns instead of blurry bilinear.
 */
function _gridToTexture(gridData) {
  if (!gridData || !gridData.cells || !gridData.cols) return null;
  const { cols, rows, cells } = gridData;
  const canvas = document.createElement('canvas');
  canvas.width = cols; canvas.height = rows;
  const ctx = canvas.getContext('2d');
  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < cols; col++) {
      const cell = cells[row * cols + col];
      if (!cell) continue;
      ctx.fillStyle = `rgb(${cell.r},${cell.g},${cell.b})`;
      ctx.fillRect(col, row, 1, 1);
    }
  }
  return PIXI.Texture.from(canvas, { scaleMode: PIXI.SCALE_MODES.NEAREST });
}

function _extractColors(char) {
  const outfit = char.outfit || {};
  // Body (torso)
  const rawTop = outfit.inner_color || (char.upper && char.upper.hex) || null;
  // Legs
  const rawBot = outfit.lower_color || (char.lower && char.lower.hex) || null;
  // Arms: outfit.outer_color > char.arm.hex > fall back to body color
  const rawArm = outfit.outer_color || (char.arm && char.arm.hex) || rawTop;

  let top = _safeHex(rawTop) ?? Math.floor(Math.random() * 0xFFFFFF);
  let bot = _safeHex(rawBot) ?? Math.floor(Math.random() * 0xFFFFFF);
  let arm = _safeHex(rawArm);  // null = will fall back to topColor in LegoCharacter

  if (!rawTop || !rawBot) {
    console.warn('[projection] missing color for char', char.id,
      '| outfit.inner_color:', outfit.inner_color,
      '| upper.hex:', char.upper?.hex);
  }
  return [top, bot, arm];
}

function _spawnBoid(charId, topColor, botColor, armColor, accList, clothGrid, lowerGrid) {
  const lego = new LegoCharacter(topColor, botColor, armColor);
  lego.updateAccessories(accList || []);
  // Apply real-pattern textures if grid data available; fall back to solid tint
  const clothTex = _gridToTexture(clothGrid);
  const lowerTex = _gridToTexture(lowerGrid);
  if (clothTex || lowerTex) lego.applyGridTextures(clothTex, lowerTex);
  else {
    lego.updateClothGrid(clothGrid || null);
    lego.updateLowerGrid(lowerGrid || null);
  }
  let rx = pixiApp.screen.width / 2 + (Math.random() - 0.5) * 300;
  let ry = pixiApp.screen.height / 2 + (Math.random() - 0.5) * 100;
  if (window.bgTransform) {
    const bg   = window.bgTransform;
    const origY = 300 + Math.random() * 300;
    const bounds = getFloorBounds(origY);
    const origX  = bounds.minX + Math.random() * (bounds.maxX - bounds.minX);
    rx = origX * bg.scale + bg.x;
    ry = origY * bg.scale + bg.y;
  }
  const boid = new Boid(rx, ry, lego, charId);
  flock.push(boid);
  boidMap[charId] = boid;
  return boid;
}

function initSocket() {
  try {
    // 不設 reconnectionAttempts（預設 Infinity）：投影牆無人看顧，原本設 10 次
    // 在預設退避下約 45 秒就永久放棄 —— 後端重啟一次，整面牆就再也不會恢復，
    // 且現場沒有人會去按重新整理。
    socket = io(BACKEND_URL, {
      transports: ['websocket'],
      reconnectionDelayMax: 5000,
    });

    socket.on('connect', () => {
      statusEl.textContent = `已連線 Socket.io ✓ (${socket.id})`;
      // Request current swarm state immediately on connect — don't wait for next tick.
      socket.emit('get_swarm', {});
    });
    socket.on('disconnect', () => {
      statusEl.textContent = '已斷線，重新連線中…';
    });
    socket.on('connect_error', () => {
      statusEl.textContent = `無法連線至 ${BACKEND_URL}`;
    });

    // 後端合成完成：顯示成品與 QR Code。
    // 此事件後端一直有 emit，但前端先前完全沒有接，所以 M6 做完卻沒有介面。
    socket.on('photo_ready', (data) => {
      if (!data || !data.ok) {
        hidePhotoOverlay();
        statusEl.textContent = '合照生成失敗：' + ((data && data.error) || '未知原因');
        statusEl.style.color = '#ff6b6b';
        return;
      }
      const img = document.getElementById('photo-result');
      const qr  = document.getElementById('photo-qr');
      // photo_b64 / qr_b64 後端已附上 data: 前綴
      if (data.photo_b64) img.src = data.photo_b64;
      if (data.qr_b64)    qr.src  = data.qr_b64;
      document.getElementById('photo-count').textContent =
        `在場人數：${data.character_count ?? '—'} 人`;
      document.getElementById('photo-url').textContent = data.photo_url || '';
      showPhotoOverlay({ pending: false });
    });

    socket.on('update_positions', (data) => {
      const chars = data.characters || [];
      if (chars.length > 0) {
        console.log('[projection] update_positions', chars.length, 'chars, first id:', chars[0]?.id,
          'outfit.inner_color:', chars[0]?.outfit?.inner_color,
          'upper.hex:', chars[0]?.upper?.hex);
      }
      const activeIds = new Set(chars.map(c => c.id));

      // Remove boids whose characters left the swarm
      for (const [id, boid] of Object.entries(boidMap)) {
        if (!activeIds.has(id)) {
          const idx = flock.indexOf(boid);
          if (idx !== -1) flock.splice(idx, 1); // guard: avoid splice(-1,1) removing wrong boid
          boid.destroy();
          delete boidMap[id];
        }
      }

      for (const char of chars) {
        const [top, bot, arm] = _extractColors(char);
        // Build accessories list: char.accessories array (preferred) OR single char.accessory
        const accList = Array.isArray(char.accessories)
          ? [...char.accessories]
          : (char.accessory && char.accessory !== 'none' ? [char.accessory] : []);
        // Merge has_glasses from outfit (VLM-detected)
        if (char.outfit?.has_glasses && !accList.includes('glasses')) accList.push('glasses');
        if (!boidMap[char.id]) {
          _spawnBoid(char.id, top, bot, arm, accList, char.cloth_grid, char.lower_grid);
        } else {
          boidMap[char.id].characterDisplay.updateColors(top, bot, arm);
          boidMap[char.id].characterDisplay.updateAccessories(accList);
          // Apply grid textures if not yet applied and data is available
          const lego = boidMap[char.id].characterDisplay;
          if (!lego._bodyOverlay && char.cloth_grid) {
            const clothTex = _gridToTexture(char.cloth_grid);
            const lowerTex = _gridToTexture(char.lower_grid);
            if (clothTex || lowerTex) lego.applyGridTextures(clothTex, lowerTex);
          } else {
            boidMap[char.id].characterDisplay.updateClothGrid(char.cloth_grid || null);
            boidMap[char.id].characterDisplay.updateLowerGrid(char.lower_grid || null);
          }
        }
        if (boidMap[char.id]) {
          boidMap[char.id].serverTarget = new Vec2((char.x / 1920) * pixiApp.screen.width, (char.y / 1080) * pixiApp.screen.height);
          boidMap[char.id].serverState = char.state || 'ROAMING';
        }
      }

      _lastUpdatePositionsTs = performance.now();
      statusEl.style.color = '';

      // Live status: show how many characters are on the wall
      const n = Object.keys(boidMap).length;
      statusEl.textContent = `已連線 Socket.io ✓ | ${n} 個角色在場`;
    });

  } catch (e) {
    statusEl.textContent = 'Socket.io 載入失敗: ' + e.message;
  }
}

// BroadcastChannel 接收（同瀏覽器下 PersonaFlow 廣播的更衣資料）
try {
  const bc = new BroadcastChannel('avatar_sync');
  bc.onmessage = ({ data }) => {
    if (!data) return;
    const top = _hexToPixi(data.topColor);
    const bot = _hexToPixi(data.bottomColor);
    const arm = data.armColor ? _hexToPixi(data.armColor) : undefined;
    const boid = boidMap[data.boidId] || flock[0];
    if (!boid) return;
    if (top !== null) boid.characterDisplay.updateColors(top, bot !== null ? bot : undefined, arm);
    if (data.hasOwnProperty('hasGlasses')) boid.characterDisplay.glasses.visible = data.hasGlasses;
  };
} catch (_) { /* BroadcastChannel not available */ }

// ─── 8. PixiJS 初始化 ────────────────────────────────────────────────────────
function _updateBgTransform() {
  const scale = Math.max(window.innerWidth / BG_W, window.innerHeight / BG_H);
  const x = (window.innerWidth  - BG_W * scale) / 2;
  const y = (window.innerHeight - BG_H * scale) / 2;
  window.bgTransform = { scale, x, y };
}

function initPixi() {
  pixiApp = new PIXI.Application({
    backgroundAlpha: 0,   // PixiJS v6: truly transparent canvas (replaces transparent:true)
    resizeTo: window,
    resolution: window.devicePixelRatio || 1,
    autoDensity: true,
  });
  document.getElementById('canvas-container').appendChild(pixiApp.view);
  pixiApp.stage.sortableChildren = true;

  window.foregroundSprites = [];
  _updateBgTransform(); // set immediately so boids have floor bounds from frame 1

  window.addEventListener('resize', () => {
    _updateBgTransform();
    resizeForegrounds();
  });

  // Start socket and game loop immediately — no waiting for assets
  initSocket();
  pixiApp.ticker.add(() => {
    // 訊號中斷偵測：門檻與文案共用同一常數，避免兩者漂移。
    // 恢復收到更新後要能自動回復正常狀態，否則一次瞬斷就永久亮紅燈。
    if (Object.keys(boidMap).length > 0) {
      const stale = performance.now() - _lastUpdatePositionsTs > STALE_THRESHOLD_MS;
      if (stale && !_staleWarned) {
        _staleWarned = true;
        statusEl.textContent = `⚠️ 伺服器訊號中斷 (超過 ${STALE_THRESHOLD_MS / 1000} 秒未收到更新)`;
        statusEl.style.color = '#ff6b6b';
      } else if (!stale && _staleWarned) {
        _staleWarned = false;
        statusEl.textContent = `已連線 Socket.io ✓ (${socket && socket.id ? socket.id : ''})`;
        statusEl.style.color = '';
      }
    }
    flock.forEach(b => b.update());
    pixiApp.stage.children.sort((a, b) => (a.zIndex || 0) - (b.zIndex || 0));
  });

  // Try to load foreground overlay sprites (optional — from walk repo objects/ folder)
  // Copy objects/ folder from anthony-1214/walk into frontend/objects/ to enable.
  const fgDefs = [
    { name: 'fg1234', path: 'objects/1234.png', baseY: 358 },
    { name: 'fg234',  path: 'objects/234.png',  baseY: 210 },
    { name: 'fg345',  path: 'objects/345.png',  baseY: 794 },
    { name: 'fg456',  path: 'objects/456.png',  baseY: 463 },
    { name: 'fg567',  path: 'objects/567.png',  baseY: 760 },
  ];
  // PixiJS v6: use PIXI.Loader (not pixiApp.loader which was removed in v6)
  const loader = new PIXI.Loader();
  fgDefs.forEach(d => loader.add(d.name, d.path));
  loader.onError.add(() => {}); // silently skip missing assets
  loader.load((_, resources) => {
    fgDefs.forEach(d => {
      if (resources[d.name] && resources[d.name].texture) {
        const sprite = new PIXI.Sprite(resources[d.name].texture);
        sprite.baseY = d.baseY;
        pixiApp.stage.addChild(sprite);
        window.foregroundSprites.push(sprite);
      }
    });
    resizeForegrounds();
  });
}

// ─── 8.5 大合照結果覆蓋層 ────────────────────────────────────────────────────
const photoOverlay = document.getElementById('photo-overlay');

function showPhotoOverlay({ pending = false } = {}) {
  photoOverlay.classList.toggle('pending', pending);
  photoOverlay.classList.add('visible');
}

function hidePhotoOverlay() {
  photoOverlay.classList.remove('visible', 'pending');
}

photoOverlay.addEventListener('click', hidePhotoOverlay);
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') hidePhotoOverlay();
});

// ─── 9. UI 按鈕 ──────────────────────────────────────────────────────────────
document.getElementById('photoBtn').onclick = () => {
  isPhotoTime = !isPhotoTime;
  document.getElementById('photoBtn').textContent = isPhotoTime ? '▶ 繼續漫遊' : '📸 集合大合照';
  if (isPhotoTime) {
    flock.forEach((b, i) => {
      b.photoTarget = new Vec2(
        pixiApp.screen.width  / 2 - 300 + (i % 5) * 150,
        pixiApp.screen.height * 0.6 + Math.floor(i / 5) * 120
      );
    });
    showPhotoOverlay({ pending: true });
    setTimeout(() => {
      if (socket && socket.connected) socket.emit('trigger_photo', { room: 'default' });
      else hidePhotoOverlay();
    }, 1200);
  } else {
    flock.forEach(b => { b.photoTarget = null; });
  }
};

document.getElementById('addBotsBtn').onclick = () => {
  if (socket && socket.connected) {
    socket.emit('inject_bots', { count: 5, room: 'default' });
  } else {
    alert('尚未連線至後端伺服器');
  }
};

document.getElementById('clearBtn').onclick = () => {
  if (socket && socket.connected) {
    socket.emit('remove_bots', {});
  }
  for (const boid of flock) boid.destroy();
  flock.length = 0;
  for (const k of Object.keys(boidMap)) delete boidMap[k];
};

// ─── 10. 滑鼠座標顯示 ────────────────────────────────────────────────────────
window.addEventListener('mousemove', (e) => {
  const coordEl = document.getElementById('coord-panel');
  if (!coordEl) return;
  if (window.bgTransform) {
    const { x, y, scale } = window.bgTransform;
    const ox = Math.round((e.clientX - x) / scale);
    const oy = Math.round((e.clientY - y) / scale);
    coordEl.innerHTML = `Screen: (${e.clientX}, ${e.clientY}) | Original: (${ox}, ${oy})`;
  }
});

// ─── 啟動 ─────────────────────────────────────────────────────────────────────
initPixi();

// Console helper: spawnTest(n) to add test boids via backend
window.spawnTest = (n = 3) => {
  if (socket && socket.connected) {
    socket.emit('inject_bots', { count: n, room: 'default' });
  }
};
</script>
