<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>PersonaFlow — 投影展示牆</title>
  <script>
    window.onerror = function(msg, url, line) {
      const d = document.createElement('div');
      d.style.cssText = 'position:absolute;top:100px;left:20px;color:red;z-index:9999;background:white;padding:10px;border:1px solid red;font-size:14px;font-family:monospace;';
      d.innerHTML = 'JS Error: ' + msg + '<br>Line: ' + line;
      document.body.appendChild(d);
    };
  </script>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: #1a1a2e url('wedding_bg.png') no-repeat center center / cover;
      overflow: hidden;
      font-family: 'Helvetica Neue', sans-serif;
    }
    canvas { display: block; cursor: crosshair; }

    #ui-panel {
      position: absolute; top: 20px; right: 20px; width: 260px;
      background: rgba(255,255,255,0.85); backdrop-filter: blur(10px);
      border-radius: 12px; padding: 15px; z-index: 10;
      border: 1px solid rgba(255,255,255,0.8);
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
    }
    #ui-panel h2 { margin: 0 0 8px; font-size: 16px; color: #333; }
    #status-line { font-size: 12px; color: #666; margin-bottom: 10px; }
    .action-btn {
      width: 100%; padding: 10px; background: #58a6ff; color: #fff;
      border: none; border-radius: 6px; cursor: pointer; font-weight: bold;
      transition: background 0.2s; margin-top: 6px;
    }
    .action-btn:hover { background: #2ea043; }

    #coord-panel {
      position: absolute; bottom: 20px; left: 20px;
      background: rgba(0,0,0,0.7); color: #0f0; font-family: monospace;
      padding: 8px 12px; border-radius: 6px; z-index: 100; pointer-events: none;
      font-size: 12px;
    }
    #canvas-container { position: absolute; inset: 0; }
  </style>

  <!-- PixiJS v6 -->
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"></script>
  <!-- Socket.io (must match PersonaFlow backend version) -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>

<div id="ui-panel">
  <h2>PersonaFlow 投影牆</h2>
  <div id="status-line">等待 Socket.io 連線…</div>
  <button id="photoBtn" class="action-btn">📸 集合大合照</button>
  <button id="clearBtn" class="action-btn" style="background:#da3633;">🗑 清除全部角色</button>
</div>

<div id="coord-panel">Screen: (0, 0) | Original: (0, 0)</div>
<div id="canvas-container"></div>

<script>
// ─── 1. 基礎向量 ──────────────────────────────────────────────────────────────
class Vec2 {
  constructor(x, y) { this.x = x || 0; this.y = y || 0; }
  add(v) { this.x += v.x; this.y += v.y; return this; }
  sub(v) { this.x -= v.x; this.y -= v.y; return this; }
  mult(n) { this.x *= n; this.y *= n; return this; }
  div(n) { if (n !== 0) { this.x /= n; this.y /= n; } return this; }
  magSq() { return this.x * this.x + this.y * this.y; }
  mag() { return Math.sqrt(this.magSq()); }
  normalize() { const m = this.mag(); if (m > 0) this.div(m); return this; }
  limit(max) { if (this.magSq() > max * max) { this.normalize(); this.mult(max); } return this; }
  dist(v) { return Math.sqrt((this.x - v.x) ** 2 + (this.y - v.y) ** 2); }
  static sub(v1, v2) { return new Vec2(v1.x - v2.x, v1.y - v2.y); }
}

// ─── 2. 全域狀態 ──────────────────────────────────────────────────────────────
const flock = [];
const boidMap = {};   // charId → Boid
let isPhotoTime = false;
let pixiApp;

// 背景尺寸（配合你的背景圖調整）
const BG_W = 1264, BG_H = 848;

// ─── 3. 背景縮放 ──────────────────────────────────────────────────────────────
function resizeForegrounds() {
  if (!window.foregroundSprites) return;
  const scale = Math.max(window.innerWidth / BG_W, window.innerHeight / BG_H);
  const x = (window.innerWidth  - BG_W * scale) / 2;
  const y = (window.innerHeight - BG_H * scale) / 2;
  window.bgTransform = { scale, x, y };
  window.foregroundSprites.forEach(sprite => {
    sprite.scale.set(scale);
    sprite.x = x; sprite.y = y;
    sprite.zIndex = y + sprite.baseY * scale;
  });
}

// ─── 4. 地板邊界（wedding_bg.png 1264×848 原始座標，移植自 boids_concept.html）
function getFloorBounds(y_orig) {
  const min_y = 250, max_y = 650; // 650 以下是暗色深淵，不讓角色走進去
  let x_left, x_right;

  if (y_orig < 500)       x_left = 560 - 1.64 * (y_orig - 250);
  else if (y_orig < 600)  x_left = 150 - 0.5  * (y_orig - 500);
  else                    x_left = 100 + 3.0  * (y_orig - 600);

  if (y_orig < 360)       x_right = 560 + 1.27 * (y_orig - 250);
  else if (y_orig < 600)  x_right = 700 + 1.15 * (y_orig - 360);
  else                    x_right = 917 - 2.5  * (y_orig - 600);

  if (x_left > x_right) { const mid = (x_left + x_right) / 2; x_left = mid; x_right = mid; }
  x_left  = Math.max(150, x_left);
  x_right = Math.min(1100, x_right);
  return { minX: x_left, maxX: x_right, minY: min_y, maxY: max_y };
}

// ─── 5. LEGO 角色類別（移植自 boids_concept.html）────────────────────────────
class LegoCharacter extends PIXI.Container {
  constructor(topColor = 0xC81E1E, bottomColor = 0x2A52BE) {
    super();
    this.topColor    = topColor;
    this.bottomColor = bottomColor;
    this.skinColor   = 0xFFCC00;

    this.inner = new PIXI.Container();
    this.inner.scale.set(2.5);
    this.inner.sortableChildren = true;
    this.addChild(this.inner);

    this.walkPhase = 0;
    this.legGap    = 1.5;
    this.legW      = 21;
    this.torsoH    = 50;
    this.shoulderOffsetX = 19;
    this.shoulderY = -this.torsoH / 2 + 2;

    this.leftLeg  = this._createLeg();  this.leftLeg.x  = -this.legW / 2 - this.legGap;  this.leftLeg.y  = this.torsoH / 2;
    this.rightLeg = this._createLeg();  this.rightLeg.x =  this.legW / 2 + this.legGap;  this.rightLeg.y = this.torsoH / 2;
    this.body     = this._createBody(); this.body.zIndex = 3;
    this.leftArm  = this._createArm();  this.leftArm.x  = -this.shoulderOffsetX; this.leftArm.y = this.shoulderY;
    this.rightArm = this._createArm();  this.rightArm.x =  this.shoulderOffsetX; this.rightArm.y = this.shoulderY;
    this.head     = this._createHead(); this.head.zIndex = 6;
    this.glasses  = this._createGlasses(); this.glasses.zIndex = 7; this.glasses.visible = false;

    this.inner.addChild(this.leftLeg, this.rightLeg, this.body,
                        this.leftArm, this.rightArm, this.head, this.glasses);
    this.updateColors(this.topColor, this.bottomColor);
  }

  _createLeg() {
    const c = new PIXI.Container();
    const g = new PIXI.Graphics();
    g.beginFill(0xFFFFFF); g.lineStyle(1.5, 0x000000);
    g.drawRect(-10.5, 0, 21, 38);
    g.drawRoundedRect(-11.5, 38, 23, 10, 2);
    g.endFill();
    c.addChild(g); c.base = g; return c;
  }

  _createArm() {
    const c = new PIXI.Container();
    const sleeve = new PIXI.Graphics();
    sleeve.beginFill(0xFFFFFF); sleeve.lineStyle(1.5, 0x000000);
    sleeve.drawRoundedRect(-6.5, 0, 13, 40, 5); sleeve.endFill();
    const hand = new PIXI.Graphics();
    hand.beginFill(this.skinColor); hand.lineStyle(1.5, 0x000000);
    const rIn = 5, rOut = 10;
    hand.moveTo(rOut * Math.cos(Math.PI), rOut * Math.sin(Math.PI) + 45);
    for (let a = 180; a <= 360; a += 10) hand.lineTo(rOut * Math.cos(a * Math.PI / 180), rOut * Math.sin(a * Math.PI / 180) + 45);
    for (let a = 360; a >= 180; a -= 10) hand.lineTo(rIn  * Math.cos(a * Math.PI / 180), rIn  * Math.sin(a * Math.PI / 180) + 45);
    hand.closePath(); hand.endFill();
    c.addChild(sleeve, hand); c.base = sleeve; return c;
  }

  _createBody() {
    const g = new PIXI.Graphics();
    g.beginFill(0xFFFFFF); g.lineStyle(1.5, 0x000000);
    g.moveTo(-19,-25); g.lineTo(19,-25); g.lineTo(25,25); g.lineTo(-25,25); g.endFill();
    return g;
  }

  _createHead() {
    const c = new PIXI.Container();
    const hs = new PIXI.Graphics();
    hs.beginFill(this.skinColor); hs.lineStyle(1.5, 0x000000);
    hs.drawRect(-8, -29, 16, 4);
    hs.drawRoundedRect(-19.25, -64, 38.5, 35, 8);
    hs.drawRoundedRect(-9, -70.5, 18, 7, 2); hs.endFill();
    const face = new PIXI.Graphics();
    face.beginFill(0x000000);
    face.drawCircle(-8, -48, 2.5); face.drawCircle(8, -48, 2.5); face.endFill();
    face.lineStyle(1.5, 0x000000);
    face.moveTo(-6, -42); face.quadraticCurveTo(0, -38, 6, -42);
    face.x = 4;
    c.addChild(hs, face); return c;
  }

  _createGlasses() {
    const g = new PIXI.Graphics();
    g.beginFill(0x33CCFF, 0.7); g.lineStyle(1.5, 0x000000);
    g.drawRoundedRect(-16, -56, 32, 12, 4); g.endFill();
    g.lineStyle(2, 0x333333);
    g.moveTo(-16,-50); g.lineTo(-20,-50);
    g.moveTo(16,-50);  g.lineTo(20,-50);
    return g;
  }

  _darken(hex) {
    const r = Math.floor(((hex >> 16) & 0xFF) * 0.6);
    const g = Math.floor(((hex >>  8) & 0xFF) * 0.6);
    const b = Math.floor(( hex        & 0xFF) * 0.6);
    return (r << 16) | (g << 8) | b;
  }

  updateColors(topColor, bottomColor) {
    if (topColor    !== undefined) this.topColor    = topColor;
    if (bottomColor !== undefined) this.bottomColor = bottomColor;
  }

  updateAnimation(isWalking, isMovingRight, _time, isGreeting = false, speedMag = 1.0) {
    if (isWalking) this.walkPhase += speedMag * 0.10;
    const swing    = isWalking ? Math.sin(this.walkPhase) : 0;
    const armAngle = (18 * Math.PI / 180) * swing;
    const legAngle = (20 * Math.PI / 180) * swing;

    this.head.scale.x = isMovingRight ? 1 : -1;
    if (this.glasses) this.glasses.scale.x = this.head.scale.x;
    const leftFront = isMovingRight;

    if (leftFront) {
      this.leftArm.zIndex  = 5; this.leftLeg.zIndex  = 4;
      this.rightArm.zIndex = 1; this.rightLeg.zIndex = 2;
      this.leftArm.base.tint  = this.topColor;    this.leftLeg.base.tint  = this.bottomColor;
      this.rightArm.base.tint = this._darken(this.topColor); this.rightLeg.base.tint = this._darken(this.bottomColor);
    } else {
      this.leftArm.zIndex  = 1; this.leftLeg.zIndex  = 2;
      this.rightArm.zIndex = 5; this.rightLeg.zIndex = 4;
      this.rightArm.base.tint = this.topColor;    this.rightLeg.base.tint = this.bottomColor;
      this.leftArm.base.tint  = this._darken(this.topColor); this.leftLeg.base.tint  = this._darken(this.bottomColor);
    }
    this.body.tint = this.topColor;

    const lerp = 0.18;
    const idle  = 15 * Math.PI / 180;
    let tLA, tRA, tLL, tRL;
    if (isWalking) {
      tLA =  armAngle; tRA = -armAngle; tLL = -legAngle; tRL = legAngle;
    } else {
      tLL = 0; tRL = 0;
      tLA = isMovingRight ?  idle : 0;
      tRA = isMovingRight ?  0    : -idle;
    }
    this.leftArm.rotation  += (tLA - this.leftArm.rotation)  * lerp;
    this.rightArm.rotation += (tRA - this.rightArm.rotation) * lerp;
    this.leftLeg.rotation  += (tLL - this.leftLeg.rotation)  * lerp;
    this.rightLeg.rotation += (tRL - this.rightLeg.rotation) * lerp;
    this.inner.y = isWalking ? -Math.abs(Math.sin(this.walkPhase)) * 3 : 0;
  }
}

// ─── 6. Boid 類別 ────────────────────────────────────────────────────────────
class Boid {
  constructor(x, y, characterDisplay, charId = null) {
    this.pos = new Vec2(x, y);
    this.vel = new Vec2((Math.random() * 2 - 1), (Math.random() * 2 - 1)).normalize().mult(1.0);
    this.acc = new Vec2(0, 0);
    this.charId = charId;
    this.photoTarget = null;
    this.walkTimer   = Math.random() * 200 + 100;
    this.restTimer   = 0;
    this.turnCooldown = 0;
    this.isWalkingToGreet = false;
    this.greetingTargetPos = null;
    this.greetPartner = null;
    this.lastGreetPartner = null;
    this.ignorePartnerTimer = 0;

    this.container = new PIXI.Container();
    this.shadow = new PIXI.Graphics();
    this.shadow.y = 75;
    for (let i = 0; i < 6; i++) {
      this.shadow.beginFill(0x000000, 0.08);
      this.shadow.drawEllipse(0, 0, 45 - i * 3, 12 - i * 0.8);
      this.shadow.endFill();
    }
    this.characterDisplay = characterDisplay;
    this.characterDisplay.scale.set(0.4);
    this.characterDisplay.x = 0; this.characterDisplay.y = 0;
    this.container.addChild(this.shadow, this.characterDisplay);
    this.container.x = x; this.container.y = y;
    pixiApp.stage.addChild(this.container);
  }

  startGreeting(target) {
    this.turnCooldown = 120;
    this.vel.mult(0); this.acc.mult(0);
    this.lastGreetPartner = target;
    this.ignorePartnerTimer = 600;
  }

  update() {
    if (this.turnCooldown > 0) this.turnCooldown--;
    if (this.ignorePartnerTimer > 0) {
      this.ignorePartnerTimer--;
      if (this.ignorePartnerTimer <= 0) this.lastGreetPartner = null;
    }

    const isTurning = this.turnCooldown > 0;

    if (isPhotoTime && this.photoTarget) {
      const diff = Vec2.sub(this.photoTarget, this.pos);
      if (diff.mag() > 2) {
        this.vel = diff.normalize().mult(3.5);
        this.pos.add(this.vel);
      } else {
        this.pos.x = this.photoTarget.x; this.pos.y = this.photoTarget.y;
        this.vel.mult(0);
      }
    } else if (this.isWalkingToGreet) {
      const dist = this.pos.dist(this.greetingTargetPos);
      if (dist < 2) {
        this.pos.x = this.greetingTargetPos.x; this.pos.y = this.greetingTargetPos.y;
        this.isWalkingToGreet = false;
        this.startGreeting(this.greetPartner);
        this.greetPartner = null;
      } else {
        this.vel = Vec2.sub(this.greetingTargetPos, this.pos).normalize().mult(1.0);
        this.pos.add(this.vel);
      }
    } else {
      if (isTurning) {
        this.vel.mult(0); this.acc.mult(0);
      } else {
        for (const other of flock) {
          if (other === this) continue;
          const diff = Vec2.sub(this.pos, other.pos);
          const d = diff.mag();
          if (d > 0 && d < 80) {
            if (this.greetPartner !== other) this.acc.add(diff.normalize().mult(0.1));
            const otherBusy = other.turnCooldown > 0 || other.isWalkingToGreet;
            if (!isTurning && !this.isWalkingToGreet && !otherBusy &&
                Math.abs(this.pos.y - other.pos.y) < 40 &&
                this.lastGreetPartner !== other && other.lastGreetPartner !== this) {
              const mx = (this.pos.x + other.pos.x) / 2;
              const my = (this.pos.y + other.pos.y) / 2;
              const tX = this.pos.x <= other.pos.x ? mx - 35 : mx + 35;
              const oX = this.pos.x <= other.pos.x ? mx + 35 : mx - 35;
              this.isWalkingToGreet = true;
              this.greetingTargetPos = new Vec2(tX, my);
              this.greetPartner = other;
              other.isWalkingToGreet = true;
              other.greetingTargetPos = new Vec2(oX, my);
              other.greetPartner = this;
            }
          }
        }
        if (this.vel.mag() < 0.1 && this.restTimer <= 0) {
          this.walkTimer = Math.random() * 200 + 100;
          this.vel = new Vec2(Math.random() * 2 - 1, Math.random() * 2 - 1).normalize().mult(1.0);
        }
      }
    }

    if (!isTurning && !this.isWalkingToGreet && !isPhotoTime) {
      if (this.restTimer > 0) {
        this.restTimer--;
        this.vel.mult(0.85);
        if (this.restTimer <= 0) {
          this.walkTimer = Math.random() * 200 + 100;
          this.vel = new Vec2(Math.random() * 2 - 1, Math.random() * 2 - 1).normalize().mult(1.0);
        }
      } else {
        this.walkTimer--;
        if (this.walkTimer <= 0) this.restTimer = 120;
      }

      if (window.bgTransform) {
        const bg = window.bgTransform;
        const origY = (this.pos.y - bg.y) / bg.scale;
        const origX = (this.pos.x - bg.x) / bg.scale;
        const bounds = getFloorBounds(origY);
        const margin = 40;
        const avoid  = new Vec2(0, 0);
        if (origX < bounds.minX + margin) avoid.x += (bounds.minX + margin - origX) * 0.02;
        if (origX > bounds.maxX - margin) avoid.x -= (origX - (bounds.maxX - margin)) * 0.02;
        if (origY < bounds.minY + margin) avoid.y += (bounds.minY + margin - origY) * 0.02;
        if (origY > bounds.maxY - margin) avoid.y -= (origY - (bounds.maxY - margin)) * 0.02;
        this.acc.add(avoid);
      }

      this.vel.add(this.acc);
      if (this.restTimer <= 0) this.vel.limit(1.3);
      this.pos.add(this.vel);
      this.acc.mult(0);

      if (window.bgTransform) {
        const bg = window.bgTransform;
        let origY = (this.pos.y - bg.y) / bg.scale;
        let origX = (this.pos.x - bg.x) / bg.scale;
        let bounds = getFloorBounds(origY);
        if (origY < bounds.minY) { origY = bounds.minY; this.vel.y =  Math.abs(this.vel.y); }
        if (origY > bounds.maxY) { origY = bounds.maxY; this.vel.y = -Math.abs(this.vel.y); }
        bounds = getFloorBounds(origY);
        if (origX < bounds.minX) { origX = bounds.minX; this.vel.x =  Math.abs(this.vel.x); if (origY > 550) this.vel.y = -Math.abs(this.vel.y); }
        if (origX > bounds.maxX) { origX = bounds.maxX; this.vel.x = -Math.abs(this.vel.x); if (origY > 550) this.vel.y = -Math.abs(this.vel.y); }
        this.pos.x = origX * bg.scale + bg.x;
        this.pos.y = origY * bg.scale + bg.y;
      }
    }

    this.container.x = this.pos.x;
    this.container.y = this.pos.y;

    if (window.bgTransform) {
      const bg    = window.bgTransform;
      const origY = (this.pos.y - bg.y) / bg.scale;
      const tD    = Math.max(0, Math.min(1, (origY - 150) / (800 - 150)));
      this.container.zIndex = origY;
      this.container.scale.set((0.5 + 0.6 * tD) * bg.scale);
    } else {
      this.container.zIndex = this.pos.y;
    }

    const isMovingRight = this.vel.x >= 0;
    const facing = isTurning && this.lastGreetPartner
      ? (this.lastGreetPartner.pos.x - this.pos.x) > 0
      : this.isWalkingToGreet && this.greetingTargetPos
        ? (this.greetingTargetPos.x - this.pos.x) > 0
        : isMovingRight;
    const speedMag  = this.vel.mag();
    const isWalking = speedMag > 0.1;
    this.characterDisplay.updateAnimation(isWalking, facing, pixiApp.ticker.lastTime, isTurning, speedMag);
  }

  destroy() {
    pixiApp.stage.removeChild(this.container);
    this.container.destroy({ children: true });
  }
}

// ─── 7. Socket.io 整合 ───────────────────────────────────────────────────────
const BACKEND_URL = 'http://localhost:5000';
let socket = null;
const statusEl = document.getElementById('status-line');

function _hexToPixi(hex) {
  if (!hex || typeof hex !== 'string') return null;
  return parseInt(hex.replace('#', ''), 16);
}

function _extractColors(char) {
  const outfit = char.outfit || {};
  const top = _hexToPixi(outfit.inner_color || (char.upper && char.upper.hex))
              ?? Math.floor(Math.random() * 0xFFFFFF);
  const bot = _hexToPixi(outfit.lower_color || (char.lower && char.lower.hex))
              ?? Math.floor(Math.random() * 0xFFFFFF);
  return [top, bot];
}

function _spawnBoid(charId, topColor, botColor) {
  const lego = new LegoCharacter(topColor, botColor);
  let rx = pixiApp.screen.width / 2 + (Math.random() - 0.5) * 300;
  let ry = pixiApp.screen.height / 2 + (Math.random() - 0.5) * 100;
  if (window.bgTransform) {
    const bg   = window.bgTransform;
    const origY = 300 + Math.random() * 300;
    const bounds = getFloorBounds(origY);
    const origX  = bounds.minX + Math.random() * (bounds.maxX - bounds.minX);
    rx = origX * bg.scale + bg.x;
    ry = origY * bg.scale + bg.y;
  }
  const boid = new Boid(rx, ry, lego, charId);
  flock.push(boid);
  boidMap[charId] = boid;
  return boid;
}

function initSocket() {
  try {
    socket = io(BACKEND_URL, { transports: ['websocket'], reconnectionAttempts: 10 });

    socket.on('connect', () => {
      statusEl.textContent = `已連線 Socket.io ✓ (${socket.id})`;
    });
    socket.on('disconnect', () => {
      statusEl.textContent = '已斷線，重新連線中…';
    });
    socket.on('connect_error', () => {
      statusEl.textContent = `無法連線至 ${BACKEND_URL}`;
    });

    socket.on('update_positions', (data) => {
      const chars = data.characters || [];
      const activeIds = new Set(chars.map(c => c.id));

      // Remove boids whose characters left the swarm
      for (const [id, boid] of Object.entries(boidMap)) {
        if (!activeIds.has(id)) {
          const idx = flock.indexOf(boid);
          if (idx !== -1) flock.splice(idx, 1); // guard: avoid splice(-1,1) removing wrong boid
          boid.destroy();
          delete boidMap[id];
        }
      }

      for (const char of chars) {
        const [top, bot] = _extractColors(char);
        if (!boidMap[char.id]) {
          _spawnBoid(char.id, top, bot);
        } else {
          boidMap[char.id].characterDisplay.updateColors(top, bot);
          if (char.outfit && char.outfit.has_glasses !== undefined) {
            boidMap[char.id].characterDisplay.glasses.visible = !!char.outfit.has_glasses;
          }
        }
      }

      // Live status: show how many characters are on the wall
      const n = Object.keys(boidMap).length;
      statusEl.textContent = `已連線 Socket.io ✓ | ${n} 個角色在場`;
    });

  } catch (e) {
    statusEl.textContent = 'Socket.io 載入失敗: ' + e.message;
  }
}

// BroadcastChannel 接收（同瀏覽器下 PersonaFlow 廣播的更衣資料）
try {
  const bc = new BroadcastChannel('avatar_sync');
  bc.onmessage = ({ data }) => {
    if (!data) return;
    const top = _hexToPixi(data.topColor);
    const bot = _hexToPixi(data.bottomColor);
    const boid = boidMap[data.boidId] || flock[0];
    if (!boid) return;
    if (top !== null) boid.characterDisplay.updateColors(top, bot !== null ? bot : undefined);
    if (data.hasOwnProperty('hasGlasses')) boid.characterDisplay.glasses.visible = data.hasGlasses;
  };
} catch (_) { /* BroadcastChannel not available */ }

// ─── 8. PixiJS 初始化 ────────────────────────────────────────────────────────
function _updateBgTransform() {
  const scale = Math.max(window.innerWidth / BG_W, window.innerHeight / BG_H);
  const x = (window.innerWidth  - BG_W * scale) / 2;
  const y = (window.innerHeight - BG_H * scale) / 2;
  window.bgTransform = { scale, x, y };
}

function initPixi() {
  pixiApp = new PIXI.Application({
    backgroundAlpha: 0,   // PixiJS v6: truly transparent canvas (replaces transparent:true)
    resizeTo: window,
    resolution: window.devicePixelRatio || 1,
    autoDensity: true,
  });
  document.getElementById('canvas-container').appendChild(pixiApp.view);
  pixiApp.stage.sortableChildren = true;

  window.foregroundSprites = [];
  _updateBgTransform(); // set immediately so boids have floor bounds from frame 1

  window.addEventListener('resize', () => {
    _updateBgTransform();
    resizeForegrounds();
  });

  // Start socket and game loop immediately — no waiting for assets
  initSocket();
  pixiApp.ticker.add(() => {
    flock.forEach(b => b.update());
    pixiApp.stage.children.sort((a, b) => (a.zIndex || 0) - (b.zIndex || 0));
  });

  // Try to load foreground overlay sprites (optional — from walk repo objects/ folder)
  // Copy objects/ folder from anthony-1214/walk into frontend/objects/ to enable.
  const fgDefs = [
    { name: 'fg1234', path: 'objects/1234.png', baseY: 358 },
    { name: 'fg234',  path: 'objects/234.png',  baseY: 210 },
    { name: 'fg345',  path: 'objects/345.png',  baseY: 794 },
    { name: 'fg456',  path: 'objects/456.png',  baseY: 463 },
    { name: 'fg567',  path: 'objects/567.png',  baseY: 760 },
  ];
  // PixiJS v6: use PIXI.Loader (not pixiApp.loader which was removed in v6)
  const loader = new PIXI.Loader();
  fgDefs.forEach(d => loader.add(d.name, d.path));
  loader.onError.add(() => {}); // silently skip missing assets
  loader.load((_, resources) => {
    fgDefs.forEach(d => {
      if (resources[d.name] && resources[d.name].texture) {
        const sprite = new PIXI.Sprite(resources[d.name].texture);
        sprite.baseY = d.baseY;
        pixiApp.stage.addChild(sprite);
        window.foregroundSprites.push(sprite);
      }
    });
    resizeForegrounds();
  });
}

// ─── 9. UI 按鈕 ──────────────────────────────────────────────────────────────
document.getElementById('photoBtn').onclick = () => {
  isPhotoTime = !isPhotoTime;
  document.getElementById('photoBtn').textContent = isPhotoTime ? '▶ 繼續漫遊' : '📸 集合大合照';
  if (isPhotoTime) {
    flock.forEach((b, i) => {
      b.photoTarget = new Vec2(
        pixiApp.screen.width  / 2 - 300 + (i % 5) * 150,
        pixiApp.screen.height * 0.6 + Math.floor(i / 5) * 120
      );
    });
  } else {
    flock.forEach(b => { b.photoTarget = null; });
  }
};

document.getElementById('clearBtn').onclick = () => {
  for (const boid of flock) boid.destroy();
  flock.length = 0;
  for (const k of Object.keys(boidMap)) delete boidMap[k];
};

// ─── 10. 滑鼠座標顯示 ────────────────────────────────────────────────────────
window.addEventListener('mousemove', (e) => {
  const coordEl = document.getElementById('coord-panel');
  if (!coordEl) return;
  if (window.bgTransform) {
    const { x, y, scale } = window.bgTransform;
    const ox = Math.round((e.clientX - x) / scale);
    const oy = Math.round((e.clientY - y) / scale);
    coordEl.innerHTML = `Screen: (${e.clientX}, ${e.clientY}) | Original: (${ox}, ${oy})`;
  }
});

// ─── 啟動 ─────────────────────────────────────────────────────────────────────
initPixi();

// Auto-spawn 5 ambient NPC boids (scene decoration — NOT in boidMap)
setTimeout(() => {
  const demoColors = [
    [0xC81E1E, 0x1E3A8A],
    [0x166534, 0xEAB308],
    [0x7C3AED, 0xF97316],
    [0xDB2777, 0x0F766E],
    [0xB45309, 0x1D4ED8],
  ];
  demoColors.forEach(([top, bot]) => {
    const lego = new LegoCharacter(top, bot);
    let rx = pixiApp.screen.width / 2 + (Math.random() - 0.5) * 400;
    let ry = pixiApp.screen.height / 2 + (Math.random() - 0.5) * 150;
    if (window.bgTransform) {
      const bg = window.bgTransform;
      const origY = 300 + Math.random() * 280;
      const bounds = getFloorBounds(origY);
      const origX = bounds.minX + Math.random() * (bounds.maxX - bounds.minX);
      rx = origX * bg.scale + bg.x;
      ry = origY * bg.scale + bg.y;
    }
    const boid = new Boid(rx, ry, lego); // charId = null, NOT in boidMap
    flock.push(boid);
  });
}, 800);

// Console helper: spawnTest(n) to add more test boids
window.spawnTest = (n = 3) => {
  for (let i = 0; i < n; i++) {
    const top = Math.floor(Math.random() * 0xFFFFFF);
    const bot = Math.floor(Math.random() * 0xFFFFFF);
    _spawnBoid('test_' + Date.now() + '_' + i, top, bot);
  }
};
