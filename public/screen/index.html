<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PixelAir 大螢幕</title>
<style>
  :root { --paper: #FAF8F5; --ink: #2F2A26; --soft: #7A716A; --line: #D8D0C6; }
  * { box-sizing: border-box; }
  /* body 不可有不透明背景。此處原為 #d9cfc0，配上 #bg3d 的 z-index:-1，
     3D 場景會被壓在 body 背景之後 —— 整個大螢幕只剩一片米色，
     而且不會有任何 console 錯誤。背景色現由 RoomScene 的
     scene.background 決定。 */
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body {
    color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  /* 兩層都用非負 z-index：3D 在下、2D 角色在上。
     #bg3d 若用負值就會掉到 body 背景之後。 */
  #bg3d { position: fixed; inset: 0; z-index: 0; }
  #stage { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  canvas { display: block; width: 100vw; height: 100vh; }

  .hud {
    position: fixed; top: 16px; left: 16px;
    background: rgba(250, 248, 245, .92);
    border: 2px dashed var(--line); border-radius: 14px;
    padding: 12px 16px; font-size: 13px; line-height: 1.7;
    max-width: 320px; max-height: 90vh; overflow-y: auto;
  }
  .hud h2 { margin: 0 0 6px; font-size: 14px; letter-spacing: .05em; }
  .hud .meta { color: var(--soft); font-size: 12px; margin-bottom: 8px; }
  .hud table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .hud td { padding: 3px 4px; vertical-align: middle; }
  .hud td.n { font-weight: 700; white-space: nowrap; max-width: 90px; overflow: hidden; text-overflow: ellipsis; }
  .bar { height: 7px; border-radius: 4px; background: var(--line); overflow: hidden; min-width: 60px; }
  .bar i { display: block; height: 100%; background: #E76F51; }
  .m { font-size: 10px; font-weight: 700; color: var(--soft); white-space: nowrap; }
  /* 這兩個是 10px 的狀態標籤（操控中／群聚中）。原本的 #E76F51 只有 2.9:1、
     #457B9D 只有 4.3:1，都不到 AA。除錯面板雖然預設 hidden、只有操作者近距離看，
     但那正是「要一眼掃到異常」的場合，讀不出來就沒有意義。 */
  .m.ACTIVE { color: #C4462A; }
  .m.SWARM { color: #3A6A88; }
  .hud[hidden] { display: none; }
  .note { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); color: var(--soft); font-size: 11px; }
  kbd { border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 10px; }


  /* ── 斷線提示 ─────────────────────────────────────────────
     沒有這個提示時，斷線在畫面上「完全看不出來」：伺服器的 IDLE_MOTION
     預設是靜止待機，因此「沒有人操控的健康場域」與「伺服器已經掛掉」
     兩者的畫面一模一樣 —— 角色都是停在原地。原本的斷線訊息只寫進
     除錯面板的 #meta，而那個面板預設 hidden，現場等於沒有任何回饋。

     放左下角：上方中央是任務橫幅與問答、右下角是排行榜，都不能被蓋到。 */
  .offline {
    position: fixed; bottom: 22px; left: 22px;
    display: flex; align-items: center; gap: 10px;
    background: var(--paper);
    border: 3px solid #C4453C; border-radius: 14px;
    padding: 11px 18px;
    font-size: 15px; font-weight: 700; color: #C4453C;
    box-shadow: 0 8px 28px -14px rgba(47,42,38,.5);
  }
  .offline[hidden] { display: none; }
  /* 緩慢脈動：投影在大螢幕上要能被餘光注意到，但不該搶走角色的注意力 */
  .offline .dot {
    width: 11px; height: 11px; border-radius: 50%;
    background: #C4453C; flex: none;
    animation: offline-pulse 1.6s ease-in-out infinite;
  }
  @keyframes offline-pulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: .25; }
  }
  @media (prefers-reduced-motion: reduce) {
    .offline .dot { animation: none; }
  }

  /* 完成回饋：短暫浮現後淡出 */
  .toasts {
    /* 離底部留高一點：遊戲畫面開著時，底下那行提示字在這個高度 */
    position: fixed; bottom: 64px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column-reverse; gap: 8px; align-items: center;
    pointer-events: none;
  }
  .toast {
    background: #2A8C80; color: #FAF8F5;
    border-radius: 999px; padding: 11px 26px;
    font-size: 17px; font-weight: 700;
    box-shadow: 0 8px 24px -12px rgba(47,42,38,.5);
    animation: pop .35s ease-out;
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(14px) scale(.94); }
    to   { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) { .toast { animation: none; } }

  /* ── 遊戲畫面：問答、任務、賓果、文字雲共用的滿版面板 ─────────
     蓋在場景上的整面紙色畫布。原本問答、任務、賓果是浮在上緣的橫幅、房間讓位縮小
     （UI-STYLING「大螢幕的橫幅不可疊在場景上」）；2026-10 統一成跟文字雲一樣滿版：
     玩法進行中，題目與進度就是全場焦點，字級可以大到最後一排也看得清楚。
     代價是進行中看不到房間裡的角色 —— 收題、結算後面板收起，房間回來。 */
  .stage-panel {
    /* 比活動名稱卡高一層：左上角的名稱卡不該壓在題目上 */
    position: fixed; inset: 18px; z-index: 4;
    display: flex; flex-direction: column;
    /* 不透明：揭曉時淡掉的選項若透出後面的房間與排行榜，畫面會糊成一片 */
    background: #FAF8F5;
    border: 3px solid var(--ink); border-radius: 22px;
    padding: 18px 26px 14px;
    box-shadow: 0 18px 50px -24px rgba(47, 42, 38, .55);
  }
  .stage-panel[hidden] { display: none; }
  .wc-meta b { color: var(--ink); font-size: 1.2em; }

  /* 任務、賓果：上緣「進行中：」，疊在場景上（房間不讓位）。置中、兩側留給左上角的活動名稱卡。
     標題寫完整、放不下就換行 —— 會多蓋到場景一點，但比「找一…」這種看不出是什麼任務好 */
  .now-bar {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 3;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 22px;
    width: max-content; max-width: calc(100vw - 360px);
    padding: 10px 26px;
    background: var(--paper); border: 3px solid var(--ink); border-radius: 24px;
    box-shadow: 0 8px 28px -14px rgba(47, 42, 38, .45);
    font-size: clamp(16px, 1.3vw, 26px); font-weight: 700; color: var(--ink);
    white-space: nowrap;
  }
  .now-bar[hidden], .nb-item[hidden] { display: none; }
  .nb-label { flex: none; color: var(--soft); }
  .nb-item { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .nb-missions { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 22px; min-width: 0; }
  .nb-missions:empty { display: none; }
  .nb-kind { flex: none; padding: 2px 12px; border-radius: 999px; color: #fff; font-size: .8em; }
  .nb-mission { background: #C4462A; }
  .nb-bingo { background: #3D6158; }
  .nb-text { min-width: 0; }
  /* #C4462A 對紙色 4.65:1：全場在追的進度數字，不能是最難讀的那一個（#E76F51 只有 2.9:1） */
  .nb-meta { flex: none; color: var(--soft); font-variant-numeric: tabular-nums; }
  .nb-meta b { color: #C4462A; }

  /* 即時問答：選項 2×2 撐滿中間，字級跟著畫面放大 */
  .quiz .wc-kind { background: var(--ink); }
  .stage-panel.quiz { z-index: 5; }   /* 跟文字雲同時開著時，問答在上（有倒數與計分） */
  .q-timebar { flex: none; height: 14px; border-radius: 8px; background: var(--line); overflow: hidden; margin: 14px 0 16px; }
  .q-timebar i { display: block; height: 100%; width: 100%; background: #E76F51; }
  .q-timebar.urgent i { background: #C4453C; }
  .q-opts { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; gap: 16px; }
  .q-opts:empty { display: none; }
  .q-opt {
    display: flex; align-items: center; gap: 22px; min-height: 0;
    border-radius: 22px; padding: 18px 32px;
    color: #fff; font-size: clamp(26px, 3vw, 56px); font-weight: 800;
    border: 6px solid transparent;
  }
  .q-opt .g { font-size: 1.3em; line-height: 1; flex: none; }
  .q-opt .t { flex: 1; min-width: 0; line-height: 1.25; overflow-wrap: anywhere; }
  .q-opt .c { font-family: ui-monospace, Consolas, monospace; font-size: .8em; flex: none; opacity: .9; }
  /* 揭曉：正解描上墨框並保持飽和，其餘退到背景 */
  .q-opt.dim { opacity: .28; }
  .q-opt.right { border-color: var(--ink); }
  .quiz.revealed .wc-hint { color: var(--ink); }

  .wc-head { display: flex; align-items: center; gap: 16px; flex: none; }
  .wc-kind {
    flex: none; font-size: 16px; font-weight: 800; letter-spacing: .08em;
    padding: 4px 14px; border-radius: 999px; background: #2A8C80; color: #fff;
  }
  .wc-title { margin: 0; flex: 1; font-size: clamp(24px, 3.2vw, 44px); font-weight: 800; color: var(--ink); line-height: 1.25; }
  .wc-meta { flex: none; font-size: 18px; font-weight: 700; color: var(--soft); font-variant-numeric: tabular-nums; }
  .wc-area { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  .wc-word {
    position: absolute; left: 0; top: 0; white-space: nowrap; font-weight: 800; line-height: 1;
    transform: translate(var(--x), var(--y));
    transition: transform .6s cubic-bezier(.2, .8, .2, 1), font-size .6s cubic-bezier(.2, .8, .2, 1), opacity .4s;
    animation: wc-pop .55s cubic-bezier(.2, 1.4, .4, 1) both;
  }
  @keyframes wc-pop { from { opacity: 0; scale: .2; } to { opacity: 1; scale: 1; } }
  .wc-hint { margin: 6px 0 0; flex: none; text-align: center; font-size: 18px; font-weight: 700; color: var(--soft); }
  .wordcloud.closed .wc-kind { background: var(--ink); }
  @media (prefers-reduced-motion: reduce) {
    .wc-word { transition: none; animation: none; }
  }

  /* ── 排行榜 ─────────────────────────────────────────────
     常駐在右下角：積分要一直看得到才會有人在意它。 */
  .ranks {
    position: fixed; right: 22px; bottom: 22px;
    width: 296px;
    background: rgba(250, 248, 245, .94);
    border: 3px solid var(--ink);
    border-radius: 18px;
    padding: 14px 18px 16px;
  }
  .ranks[hidden] { display: none; }
  .ranks h2 {
    margin: 0 0 8px; font-size: 13px; letter-spacing: .18em; color: #B44A2F;
  }
  .ranks ol { list-style: none; margin: 0; padding: 0; }
  .ranks li {
    display: flex; align-items: center; gap: 10px;
    padding: 5px 0; font-size: 19px;
    border-bottom: 1px solid var(--line);
  }
  .ranks li:last-child { border-bottom: none; }
  .ranks .no {
    width: 26px; flex: none; text-align: center;
    font-family: ui-monospace, Consolas, monospace; font-size: 15px; color: var(--soft);
  }
  /* 15px 粗體仍算「一般文字」（粗體要 18.66px 以上才降到 3:1），
     #E76F51 的 2.9:1 不合格。排行榜是投影在大螢幕、隔著整個場地看的東西。 */
  .ranks li.top .no { color: #C4462A; font-weight: 900; }
  .ranks .who {
    flex: 1; min-width: 0; font-weight: 700;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ranks .pts {
    font-family: ui-monospace, Consolas, monospace;
    font-variant-numeric: tabular-nums; font-weight: 900;
  }
  /* ── 大合照下載 QR ─────────────────────────────────────
     拍完大合照後在右下角顯示，主持人在主控端切換顯示／隱藏；照片本身不帶 QR（2026-10-19）。
     排行榜也在右下角：兩個都開著時 QR 排到排行榜左邊，不疊在一起。
     QR 要隔著場地掃得到，所以印得大、白底留邊（QR 規格的安靜區）。 */
  /* z-index 3：在問答、文字雲的滿版面板（4、5）後面 —— 面板開著時不該蓋在題目上（2026-10-19） */
  .photo-qr {
    position: fixed; right: 22px; bottom: 22px; z-index: 3;
    width: 268px; box-sizing: border-box;
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 18px;
    padding: 14px 14px 12px;
    text-align: center;
  }
  .photo-qr[hidden] { display: none; }
  .ranks:not([hidden]) ~ .photo-qr { right: 340px; }
  .photo-qr img { display: block; width: 236px; height: 236px; image-rendering: pixelated; }
  .photo-qr p { margin: 8px 0 0; font-size: 20px; font-weight: 900; color: var(--ink); }
  /* 右上角的小 ×：在大螢幕那台電腦上直接收起 QR（不必回主控端）。投影出去要不搶眼：
     小、淡，滑鼠移上去才清楚 */
  .photo-qr-close {
    position: absolute; top: -12px; right: -12px;
    width: 30px; height: 30px; padding: 0;
    border: 2px solid var(--ink); border-radius: 50%;
    background: #fff; color: var(--ink);
    font: 900 18px/1 system-ui, sans-serif;
    cursor: pointer; opacity: .45;
    pointer-events: auto;
  }
  .photo-qr-close:hover, .photo-qr-close:focus-visible { opacity: 1; }

  /* 音效被瀏覽器擋住時的提示（public/screen/sfx.js）。給操作者看的，不是給觀眾：
     刻意小、低對比、放在不擋角色的右下角（見 docs/notes/UI-STYLING.md「刻意壓低對比的地方」）。
     點一下畫面解鎖後就消失。 */
  .sfx-note {
    position: fixed; right: 12px; bottom: 10px; z-index: 50;
    font-size: 12px; color: rgba(58, 46, 39, .45);
    pointer-events: none;
  }
  .sfx-note[hidden] { display: none; }
</style>
<link rel="stylesheet" href="scenes/pixel-scene.css">
<!-- three 由本機 node_modules 直出，不走 CDN。
     現場網路不通或 CDN 被擋時，大螢幕的整個 3D 背景會消失 ——
     而本機開發永遠測不出這個狀況（見 §6 風險 1，同 nipplejs 的處置）。 -->
<script type="importmap">
{ "imports": {
  "three": "/vendor/three.module.js",
  "three/addons/": "/vendor/three-addons/"
}}
</script>
</head>
<body>
<div id="bg3d"></div>
<canvas id="stage"></canvas>

<!-- ── 遊戲畫面 ───────────────────────────────────────────
     問答、文字雲是滿版面板（.stage-panel）：題頭一行（玩法標籤・標題・人數）、
     中間是主畫面、底下一行提示。
     任務、賓果是上緣「進行中：」（2026-10-17）：參與者靠手機玩、在現場找人，
     不需要盯著大螢幕，所以只佔上緣一小塊，直接疊在場景上（房間大小不變）。 -->
<div class="now-bar" id="now-bar" hidden>
  <span class="nb-label">進行中：</span>
  <!-- 任務可以同時好幾個，一個一格（screen.js 的 renderMissionsBar） -->
  <span class="nb-missions" id="nb-missions"></span>
  <span class="nb-item" id="nb-bingo" hidden>
    <b class="nb-kind nb-bingo">人物賓果</b>
    <span class="nb-text" id="bingo-lead">—</span>
    <span class="nb-meta" id="bingo-meta"></span>
  </span>
</div>

<!-- 即時問答。題目在共享畫布上呈現，手機只是輸入裝置 —— 這與任務的
     設計原則一致：完成與結果都必須被全場看見。 -->
<div class="stage-panel quiz" id="quiz" hidden>
  <div class="wc-head">
    <span class="wc-kind" id="q-no">第 1 題</span>
    <p class="wc-title" id="q-title">—</p>
    <span class="wc-meta" id="q-foot">已作答 <b id="q-answered">0</b> 人</span>
  </div>
  <div class="q-timebar" id="q-timebar"><i id="q-timefill"></i></div>
  <div class="q-opts" id="q-opts"></div>
  <p class="wc-hint" id="q-state">作答中</p>
</div>

<!-- 文字雲（public/screen/screen.js 的 showWordCloud）。整面蓋在場景上：
     答案是這一刻全場的焦點，場景淡到後面。不顯示是誰寫的。 -->
<div class="stage-panel wordcloud" id="wordcloud" hidden>
  <div class="wc-head">
    <span class="wc-kind">文字雲</span>
    <p class="wc-title" id="wc-title">—</p>
    <span class="wc-meta" id="wc-meta">0 人作答</span>
  </div>
  <div class="wc-area" id="wc-area"></div>
  <p class="wc-hint" id="wc-hint">拿起手機，輸入你的答案！</p>
</div>
</div>

<div class="ranks" id="ranks" hidden>
  <h2>積分排行</h2>
  <ol id="ranks-list"></ol>
</div>

<!-- 大合照下載 QR：拍完後顯示幾分鐘（SCREEN_PHOTO_QR）。要放在 #ranks 後面，CSS 靠兄弟選擇器避開排行榜 -->
<div class="photo-qr" id="photo-qr" hidden>
  <button class="photo-qr-close" id="photo-qr-close" type="button" aria-label="收起 QR Code">×</button>
  <img id="photo-qr-img" alt="大合照下載 QR Code">
  <p>📸 掃描下載大合照</p>
</div>

<div class="toasts" id="toasts"></div>
<!-- 除錯面板：預設隱藏，按 D 切換。保留自 M2 開發期，
     用於檢查 α 權重、剛體避障半徑與速度向量。 -->
<div class="hud" id="hud" hidden>
  <h2>除錯視圖</h2>
  <div class="meta" id="meta">等待連線…</div>
  <table id="list"></table>
  <div class="note">
    橘＝主動控制態，藍＝湧現漫遊態；角色外圈粗細即為 α 權重。<br>
    黃圈為道具的剛體避障半徑，黃框為邊界回推帶。<br>
    在主辦端「系統 → 大螢幕除錯」關閉。
  </div>
</div>

<!-- 斷線提示。見上方 .offline 的說明：靜止的角色無法區分健康與故障。 -->
<div class="offline" id="offline" hidden>
  <span class="dot"></span>
  <span id="offline-text">與伺服器斷線，正在重新連線…</span>
</div>

<!-- 左上角標題卡：主辦端設定的活動名稱（未設定時顯示場景名）。樣式見 scenes/pixel-scene.css -->
<header class="event-card" id="event-card" hidden>
  <h1></h1>
  <p hidden></p>
</header>
<script type="module" src="screen.js"></script>
</body>
</html>
