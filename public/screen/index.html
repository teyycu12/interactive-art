<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PersonaFlow 大螢幕</title>
<style>
  :root { --paper: #FAF8F5; --ink: #2F2A26; --soft: #7A716A; --line: #D8D0C6; }
  * { box-sizing: border-box; }
  /* body 不可有不透明背景。此處原為 #d9cfc0，配上 #bg3d 的 z-index:-1，
     3D 場景會被壓在 body 背景之後 —— 整個大螢幕只剩一片米色，
     而且不會有任何 console 錯誤。背景色現由 RoomScene 的
     scene.background 決定。 */
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body {
    color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  /* 兩層都用非負 z-index：3D 在下、2D 角色在上。
     #bg3d 若用負值就會掉到 body 背景之後。 */
  #bg3d { position: fixed; inset: 0; z-index: 0; }
  #stage { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  canvas { display: block; width: 100vw; height: 100vh; }

  .hud {
    position: fixed; top: 16px; left: 16px;
    background: rgba(250, 248, 245, .92);
    border: 2px dashed var(--line); border-radius: 14px;
    padding: 12px 16px; font-size: 13px; line-height: 1.7;
    max-width: 320px; max-height: 90vh; overflow-y: auto;
  }
  .hud h2 { margin: 0 0 6px; font-size: 14px; letter-spacing: .05em; }
  .hud .meta { color: var(--soft); font-size: 12px; margin-bottom: 8px; }
  .hud table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .hud td { padding: 3px 4px; vertical-align: middle; }
  .hud td.n { font-weight: 700; white-space: nowrap; max-width: 90px; overflow: hidden; text-overflow: ellipsis; }
  .bar { height: 7px; border-radius: 4px; background: var(--line); overflow: hidden; min-width: 60px; }
  .bar i { display: block; height: 100%; background: #E76F51; }
  .m { font-size: 10px; font-weight: 700; color: var(--soft); white-space: nowrap; }
  /* 這兩個是 10px 的狀態標籤（操控中／群聚中）。原本的 #E76F51 只有 2.9:1、
     #457B9D 只有 4.3:1，都不到 AA。除錯面板雖然預設 hidden、只有操作者近距離看，
     但那正是「要一眼掃到異常」的場合，讀不出來就沒有意義。 */
  .m.ACTIVE { color: #C4462A; }
  .m.SWARM { color: #3A6A88; }
  .hud[hidden] { display: none; }
  .note { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); color: var(--soft); font-size: 11px; }
  kbd { border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 10px; }

  /* 投影時這行應該不顯眼；它只是給操作者的提示 */
  .hint-key {
    position: fixed; bottom: 14px; right: 16px;
    font-size: 11px; color: var(--line); user-select: none;
  }

  /* ── 斷線提示 ─────────────────────────────────────────────
     沒有這個提示時，斷線在畫面上「完全看不出來」：伺服器的 IDLE_MOTION
     預設是靜止待機，因此「沒有人操控的健康場域」與「伺服器已經掛掉」
     兩者的畫面一模一樣 —— 角色都是停在原地。原本的斷線訊息只寫進
     除錯面板的 #meta，而那個面板預設 hidden，現場等於沒有任何回饋。

     放左下角：上方中央是任務橫幅與問答、右下角是排行榜，都不能被蓋到。 */
  .offline {
    position: fixed; bottom: 22px; left: 22px;
    display: flex; align-items: center; gap: 10px;
    background: var(--paper);
    border: 3px solid #C4453C; border-radius: 14px;
    padding: 11px 18px;
    font-size: 15px; font-weight: 700; color: #C4453C;
    box-shadow: 0 8px 28px -14px rgba(47,42,38,.5);
  }
  .offline[hidden] { display: none; }
  /* 緩慢脈動：投影在大螢幕上要能被餘光注意到，但不該搶走角色的注意力 */
  .offline .dot {
    width: 11px; height: 11px; border-radius: 50%;
    background: #C4453C; flex: none;
    animation: offline-pulse 1.6s ease-in-out infinite;
  }
  @keyframes offline-pulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: .25; }
  }
  @media (prefers-reduced-motion: reduce) {
    .offline .dot { animation: none; }
  }

  /* 任務橫幅：任務公告必須在共享畫布上被看見（規格 v3.0 §3.1 第 05 步） */
  .mission {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
    background: var(--paper); border: 3px solid #E76F51; border-radius: 18px;
    padding: 14px 30px; text-align: center; min-width: 380px;
    box-shadow: 0 8px 28px -14px rgba(47,42,38,.4);
  }
  .mission[hidden] { display: none; }
  .mission .m-label {
    font-size: 11px; letter-spacing: .2em; color: #B44A2F; font-weight: 700;
  }
  .mission .m-title { font-size: 27px; font-weight: 900; margin: 2px 0 4px; }
  .mission .m-brief { font-size: 13px; color: var(--soft); }
  .mission .m-prog {
    margin-top: 9px; padding-top: 9px; border-top: 1px dashed var(--line);
    font-size: 14px; font-weight: 700;
  }
  /* 深一階的橘：#E76F51 對紙色只有 2.9:1，投影到大螢幕、又隔著一整個場地看，
     這個數字是全場在追的進度，不能是最難讀的那一個。#C4462A 為 4.65:1。 */
  .mission .m-prog b { font-size: 19px; color: #C4462A; }

  /* 完成回饋：短暫浮現後淡出 */
  .toasts {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column-reverse; gap: 8px; align-items: center;
    pointer-events: none;
  }
  .toast {
    background: #2A8C80; color: #FAF8F5;
    border-radius: 999px; padding: 11px 26px;
    font-size: 17px; font-weight: 700;
    box-shadow: 0 8px 24px -12px rgba(47,42,38,.5);
    animation: pop .35s ease-out;
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(14px) scale(.94); }
    to   { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) { .toast { animation: none; } }

  /* ── 即時問答 ───────────────────────────────────────────
     投影用尺寸：最後一排的人要看得清楚，所以字級遠大於一般網頁。 */
  .quiz {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
    width: min(1180px, 92vw);
    background: var(--paper);
    border: 4px solid var(--ink);
    border-radius: 22px;
    padding: 22px 30px 26px;
    box-shadow: 0 14px 44px -18px rgba(47, 42, 38, .55);
  }
  .quiz[hidden] { display: none; }

  .q-head {
    display: flex; align-items: baseline; justify-content: space-between;
    font-size: 14px; font-weight: 700; letter-spacing: .12em; color: var(--soft);
    margin-bottom: 6px;
  }
  .q-title { font-size: 34px; font-weight: 900; line-height: 1.35; margin: 0 0 16px; }

  /* 倒數條由滿到空，投影出去比數字更容易被餘光注意到 */
  .q-timebar { height: 12px; border-radius: 8px; background: var(--line); overflow: hidden; margin-bottom: 18px; }
  .q-timebar i { display: block; height: 100%; width: 100%; background: #E76F51; }
  .q-timebar.urgent i { background: #C4453C; }

  .q-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .q-opt {
    display: flex; align-items: center; gap: 14px;
    border-radius: 16px; padding: 16px 20px;
    color: #fff; font-size: 25px; font-weight: 700;
    border: 4px solid transparent;
  }
  .q-opt .g { font-size: 30px; line-height: 1; flex: none; }
  .q-opt .t { flex: 1; min-width: 0; }
  .q-opt .c {
    font-family: ui-monospace, Consolas, monospace;
    font-size: 22px; flex: none; opacity: .85;
  }
  /* 揭曉：正解描上墨框並保持飽和，其餘退到背景 */
  .q-opt.dim { opacity: .28; }
  .q-opt.right { border-color: var(--ink); }

  .q-foot {
    margin-top: 16px; text-align: center;
    font-size: 18px; font-weight: 700; color: var(--soft);
  }
  .q-foot b { color: var(--ink); font-size: 22px; }

  /* ── 排行榜 ─────────────────────────────────────────────
     常駐在右下角：積分要一直看得到才會有人在意它。 */
  /* 兩隊對抗條。置頂置中 —— 這是全場唯一的「比賽狀態」，
     跟角落的個人排行榜分開放，遠處也看得到。 */
  .versus {
    position: fixed; top: 22px; left: 50%; transform: translateX(-50%);
    width: min(560px, 46vw);
  }
  .versus[hidden] { display: none; }
  .versus-bar {
    display: flex;
    height: 22px;
    border: 3px solid var(--ink);
    border-radius: 999px;
    overflow: hidden;
    background: rgba(250, 248, 245, .94);
  }
  .versus-bar i { display: block; height: 100%; transition: width .45s ease; }
  .versus-b { flex: 1; }
  .versus-labels {
    display: flex; justify-content: space-between;
    margin-top: 6px;
    font-size: 17px; font-weight: 800;
    font-variant-numeric: tabular-nums;
  }

  .ranks {
    position: fixed; right: 22px; bottom: 22px;
    width: 296px;
    background: rgba(250, 248, 245, .94);
    border: 3px solid var(--ink);
    border-radius: 18px;
    padding: 14px 18px 16px;
  }
  .ranks[hidden] { display: none; }
  .ranks h2 {
    margin: 0 0 8px; font-size: 13px; letter-spacing: .18em; color: #B44A2F;
  }
  .ranks ol { list-style: none; margin: 0; padding: 0; }
  .ranks li {
    display: flex; align-items: center; gap: 10px;
    padding: 5px 0; font-size: 19px;
    border-bottom: 1px solid var(--line);
  }
  .ranks li:last-child { border-bottom: none; }
  .ranks .no {
    width: 26px; flex: none; text-align: center;
    font-family: ui-monospace, Consolas, monospace; font-size: 15px; color: var(--soft);
  }
  /* 15px 粗體仍算「一般文字」（粗體要 18.66px 以上才降到 3:1），
     #E76F51 的 2.9:1 不合格。排行榜是投影在大螢幕、隔著整個場地看的東西。 */
  .ranks li.top .no { color: #C4462A; font-weight: 900; }
  .ranks .who {
    flex: 1; min-width: 0; font-weight: 700;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ranks .pts {
    font-family: ui-monospace, Consolas, monospace;
    font-variant-numeric: tabular-nums; font-weight: 900;
  }
</style>
<!-- three 由本機 node_modules 直出，不走 CDN。
     現場網路不通或 CDN 被擋時，大螢幕的整個 3D 背景會消失 ——
     而本機開發永遠測不出這個狀況（見 §6 風險 1，同 nipplejs 的處置）。 -->
<script type="importmap">
{ "imports": {
  "three": "/vendor/three.module.js",
  "three/addons/": "/vendor/three-addons/"
}}
</script>
</head>
<body>
<div id="bg3d"></div>
<canvas id="stage"></canvas>

<div class="mission" id="mission" hidden>
  <div class="m-label">現在的任務</div>
  <div class="m-title" id="m-title">—</div>
  <div class="m-brief" id="m-brief">—</div>
  <div class="m-prog" id="m-prog" hidden></div>
</div>

<!-- 即時問答。題目在共享畫布上呈現，手機只是輸入裝置 —— 這與任務的
     設計原則一致：完成與結果都必須被全場看見。 -->
<div class="quiz" id="quiz" hidden>
  <div class="q-head">
    <span id="q-no">第 1 題</span>
    <span id="q-state">作答中</span>
  </div>
  <p class="q-title" id="q-title">—</p>
  <div class="q-timebar" id="q-timebar"><i id="q-timefill"></i></div>
  <div class="q-opts" id="q-opts"></div>
  <div class="q-foot" id="q-foot">已作答 <b id="q-answered">0</b> 人</div>
</div>

<!-- 兩隊對抗條。分界線隨分數移動，一眼看得出哪邊領先 —— 兩隊只要一條，
     比多隊排行榜省版面得多，也是「兩隊」這個選擇換來的簡化。 -->
<div class="versus" id="versus" hidden>
  <div class="versus-bar">
    <i class="versus-a" id="versus-a"></i>
    <i class="versus-b" id="versus-b"></i>
  </div>
  <div class="versus-labels">
    <span id="versus-a-label"></span>
    <span id="versus-b-label"></span>
  </div>
</div>

<div class="ranks" id="ranks" hidden>
  <h2>積分排行</h2>
  <ol id="ranks-list"></ol>
</div>

<div class="toasts" id="toasts"></div>
<!-- 除錯面板：預設隱藏，按 D 切換。保留自 M2 開發期，
     用於檢查 α 權重、剛體避障半徑與速度向量。 -->
<div class="hud" id="hud" hidden>
  <h2>除錯視圖</h2>
  <div class="meta" id="meta">等待連線…</div>
  <table id="list"></table>
  <div class="note">
    橘＝主動控制態，藍＝湧現漫遊態；角色外圈粗細即為 α 權重。<br>
    黃圈為道具的剛體避障半徑，黃框為邊界回推帶。<br>
    再按 <kbd>D</kbd> 關閉。
  </div>
</div>

<!-- 斷線提示。見上方 .offline 的說明：靜止的角色無法區分健康與故障。 -->
<div class="offline" id="offline" hidden>
  <span class="dot"></span>
  <span id="offline-text">與伺服器斷線，正在重新連線…</span>
</div>

<div class="hint-key">按 <kbd>1–3</kbd> 切換光線 · <kbd>R</kbd> 重置視角 · <kbd>D</kbd> 除錯</div>
<script type="module" src="screen.js"></script>
</body>
</html>
