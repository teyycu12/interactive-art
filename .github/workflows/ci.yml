name: PersonaFlow CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    # 釘住版本而非用 ubuntu-latest：latest 從 22.04 換到 24.04 時，
    # libgl1-mesa-glx 在 noble 已被移除，CI 因此無預警中斷。
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    # opencv-python（非 headless）需要 libGL.so.1。
    # libgl1-mesa-glx 在 Ubuntu 24.04(noble) 已移除，改用 libgl1 —— 該套件在
    # 22.04 與 24.04 皆存在，故不會因日後更換 runner 版本再次中斷。
    - name: Install system dependencies (OpenGL / GLib for OpenCV)
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglib2.0-0

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install -r requirements-dev.txt

    # 前端沒有建置流程，也沒有 npm 相依 —— 直接用 Node 內建的測試執行器。
    # 涵蓋的是 draw() 迴圈裡的格柵記憶化：單次 pipeline 約 2.2ms，若快取失效，
    # 30 個角色的每幀成本會達 65ms（約 15fps），遠低於 60fps 目標。
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Run frontend tests
      run: node --test frontend/tests/

    - name: Run Pytest Suite
      run: |
        cd backend
        pytest tests/ -v --junitxml=test-results.xml

    # 多個測試在缺少 Flask / Pillow 時會 skip 而非失敗（例如 photo_composer
    # 的合成測試、socketio handler 測試）。若相依安裝出問題，CI 會顯示綠燈
    # 但其實什麼都沒測到 —— 綠燈卻沒測到比紅燈更危險。
    # requirements.txt 已包含這些套件，因此在 CI 裡出現 skip 一律視為失敗。
    - name: Fail if any test was skipped
      run: |
        cd backend
        python - <<'PY'
        import sys, xml.etree.ElementTree as ET

        root = ET.parse("test-results.xml").getroot()
        suites = root.iter("testsuite") if root.tag == "testsuites" else [root]

        skipped = []
        for suite in suites:
            for case in suite.iter("testcase"):
                for sk in case.findall("skipped"):
                    skipped.append(
                        f"{case.get('classname')}.{case.get('name')}: "
                        f"{sk.get('message', 'no reason given')}"
                    )

        if skipped:
            print(f"CI 中有 {len(skipped)} 個測試被 skip —— 相依套件可能未正確安裝：")
            for line in skipped:
                print(f"  - {line}")
            sys.exit(1)
        print("沒有測試被 skip，全部實際執行。")
        PY
