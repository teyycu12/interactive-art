<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Hall · 娃娃屋透視視角</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #110a11; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  .ui { position: fixed; font-family: "Inter", "PingFang TC", "Microsoft JhengHei", sans-serif; color: #f5f5f5; user-select: none; }
  .card { top: 20px; left: 20px; padding: 16px 20px; background: rgba(18,22,26,0.72); backdrop-filter: blur(10px); border-radius: 14px; border: 1px solid rgba(255,255,255,0.08); max-width: 300px; box-shadow: 0 8px 30px rgba(0,0,0,0.25); }
  .card .eyebrow { font-size: 10px; letter-spacing: 2.5px; color: #f0b429; font-weight: 700; }
  .card .eyebrow::before { content: "● "; }
  .card h1 { font-size: 23px; font-weight: 700; margin: 5px 0 3px; }
  .card p { font-size: 12px; color: #9aa5ac; line-height: 1.45; }
  .panel { top: 20px; right: 20px; padding: 10px; background: rgba(18,22,26,0.72); backdrop-filter: blur(10px); border-radius: 14px; border: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 8px; width: 236px; box-shadow: 0 8px 30px rgba(0,0,0,0.25); }
  .seg { display: flex; background: rgba(255,255,255,0.06); border-radius: 9px; padding: 3px; }
  .seg button { flex: 1; border: none; background: transparent; color: #cbd2d7; font-size: 12px; padding: 7px 4px; border-radius: 7px; cursor: pointer; font-weight: 600; transition: .15s; }
  .seg button.active { background: #f0b429; color: #1a1a1a; }
  .row { display: flex; gap: 8px; }
  .row button { flex: 1; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.04); color: #e6ebee; font-size: 12px; padding: 8px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: .15s; }
  .row button:hover { background: rgba(255,255,255,0.12); }
  .row button.active { background: #f0b429; color: #1a1a1a; border-color: #f0b429; }
  .hint { bottom: 18px; left: 20px; font-size: 11px; color: #4a555c; background: rgba(255,255,255,0.6); padding: 7px 12px; border-radius: 8px; }
  .hint b { color: #232a2f; }
  .status { bottom: 18px; right: 20px; font-size: 11px; color: #4a555c; background: rgba(255,255,255,0.6); padding: 7px 12px; border-radius: 8px; display: flex; align-items: center; gap: 6px; }
  .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #37c76a; box-shadow: 0 0 6px #37c76a; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #110a11; color: #f5f5f5; font-family: sans-serif; font-size: 15px; z-index: 10; flex-direction: column; gap: 12px; }
  .spinner { width: 32px; height: 32px; border: 3px solid rgba(255,255,255,0.15); border-top-color: #f5f5f5; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .bubble { position: fixed; transform: translate(-50%, -100%); background: #fff; color: #222; font-family: "PingFang TC", sans-serif; font-size: 14px; font-weight: 700; padding: 6px 12px; border-radius: 14px; box-shadow: 0 4px 14px rgba(0,0,0,0.28); pointer-events: none; white-space: nowrap; z-index: 5; }
  .bubble::after { content: ''; position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%); border: 6px solid transparent; border-top-color: #fff; border-bottom: 0; }
</style>
</head>
<body>
  <div id="app"></div>
  <div id="loading"><div class="spinner"></div><div id="loadmsg">載入場景中…</div></div>

  <div class="ui card">
    <div class="eyebrow">WEDDING SHOWCASE</div>
    <h1>Wedding Hall</h1>
    <p>娃娃屋透視視角 · 角色會走動並打招呼</p>
  </div>
  <div class="ui panel">
    <div class="seg" id="lightSeg">
      <button data-light="day" class="active">Daylight</button>
      <button data-light="evening">Evening</button>
      <button data-light="night">Night</button>
    </div>
    <div class="row">
      <button id="btnOrbit">↻ Auto orbit</button>
      <button id="btnReset">⟳ 預設視角</button>
    </div>
  </div>
  <div class="ui hint"><b>Drag</b> 環顧 · <b>Wheel</b> 縮放 · <b>Right-drag</b> 平移 · <b>1–3</b> 切換光線</div>
  <div class="ui status">THREE.JS · glTF · WEBGL2</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ===== 房間尺寸（替換為婚禮會場尺寸）=====
const RW = 24, RD = 50, WALL_H = 12;      
const HALF_W = RW / 2, HALF_D = RD / 2;

// 角色（保留原版設定）
const CHAR_DEFS = [
  { url: 'https://static.poly.pizza/1e87091b-7202-4906-bd14-22881d9b945c.glb', name: 'Matt', greet: '嗨！' },
  { url: 'https://static.poly.pizza/2d0ad9ee-2e86-4b0c-b20e-cfc8c80c8c78.glb', name: 'Sam', greet: '你好～' },
];

// ---- Renderer / Scene / Camera ----
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x110a11);
scene.fog = new THREE.Fog(0x110a11, 45, 130);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 500);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI / 2.02; // 防止看穿地板
controls.autoRotateSpeed = 0.5;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// 光源 (保留原本的豐富系統，以配合按鈕切換)
const hemi = new THREE.HemisphereLight(0xffffff, 0x8a8577, 1.0); scene.add(hemi);
const ambient = new THREE.AmbientLight(0xffffff, 0.32); scene.add(ambient);
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02; sun.shadow.radius = 4;
const r = Math.max(RW, RD);
sun.shadow.camera.left = -r; sun.shadow.camera.right = r; sun.shadow.camera.top = r; sun.shadow.camera.bottom = -r;
sun.shadow.camera.near = 0.5; sun.shadow.camera.far = WALL_H * 10;
scene.add(sun, sun.target);
const lamp = new THREE.PointLight(0xffcf8a, 0, 40, 1.4); lamp.position.set(0, WALL_H * 0.7, 0); scene.add(lamp);

// ---- 蓋房間：替換為 3D 婚禮會場 (娃娃屋透視版) ----
function buildRoom() {
  const envInt = 0.4; // 反射強度

  // (A) 深色木地板 (THREE.FrontSide，讓底部可透視)
  const floorMat = new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.6, side: THREE.FrontSide, envMapIntensity: envInt });
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(RW, RD), floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  // (B) 迎賓白地毯
  const carpetMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9, side: THREE.FrontSide, envMapIntensity: envInt });
  const carpet = new THREE.Mesh(new THREE.PlaneGeometry(4, RD - 8), carpetMat);
  carpet.rotation.x = -Math.PI / 2;
  carpet.position.set(0, 0.05, 2); 
  carpet.receiveShadow = true;
  scene.add(carpet);

  // (C) 娃娃屋透視四面牆 (使用 FrontSide 自動隱形阻擋視線的牆面)
  const wallMat = new THREE.MeshStandardMaterial({ color: 0xe8d5d5, roughness: 0.8, side: THREE.FrontSide, envMapIntensity: envInt });
  
  // 後牆 (舞台背景)
  const backWall = new THREE.Mesh(new THREE.PlaneGeometry(RW, WALL_H), wallMat);
  backWall.position.set(0, WALL_H / 2, -HALF_D);
  backWall.receiveShadow = true;
  scene.add(backWall);

  // 前牆 (入口)
  const frontWall = new THREE.Mesh(new THREE.PlaneGeometry(RW, WALL_H), wallMat);
  frontWall.position.set(0, WALL_H / 2, HALF_D);
  frontWall.rotation.y = Math.PI; 
  frontWall.receiveShadow = true;
  scene.add(frontWall);

  // 左牆
  const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(RD, WALL_H), wallMat);
  leftWall.position.set(-HALF_W, WALL_H / 2, 0);
  leftWall.rotation.y = Math.PI / 2; 
  leftWall.receiveShadow = true;
  scene.add(leftWall);

  // 右牆
  const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(RD, WALL_H), wallMat);
  rightWall.position.set(HALF_W, WALL_H / 2, 0);
  rightWall.rotation.y = -Math.PI / 2; 
  rightWall.receiveShadow = true;
  scene.add(rightWall);

  // (D) 香檳金花門拱門與落地柱
  const archMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.8, roughness: 0.2, envMapIntensity: 0.8 });
  const archTorus = new THREE.Mesh(new THREE.TorusGeometry(3.5, 0.2, 16, 100, Math.PI), archMat);
  archTorus.position.set(0, 3.5, -20);
  archTorus.castShadow = true;
  scene.add(archTorus);

  const archLegGeo = new THREE.CylinderGeometry(0.2, 0.2, 3.5, 16);
  const archLegL = new THREE.Mesh(archLegGeo, archMat);
  archLegL.position.set(-3.5, 1.75, -20);
  archLegL.castShadow = true;
  scene.add(archLegL);

  const archLegR = new THREE.Mesh(archLegGeo, archMat);
  archLegR.position.set(3.5, 1.75, -20);
  archLegR.castShadow = true;
  scene.add(archLegR);

  // (E) 木製賓客長椅 (含 4 支椅腳)
  const woodBenchMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.7, envMapIntensity: envInt });
  function createChair() {
      const group = new THREE.Group();
      const seat = new THREE.Mesh(new THREE.BoxGeometry(4, 0.1, 0.8), woodBenchMat);
      seat.position.set(0, 0.6, 0); seat.castShadow = true; group.add(seat);
      const backrest = new THREE.Mesh(new THREE.BoxGeometry(4, 0.8, 0.1), woodBenchMat);
      backrest.position.set(0, 1.05, 0.35); backrest.castShadow = true; group.add(backrest);
      const legGeo = new THREE.BoxGeometry(0.1, 0.6, 0.1);
      [[-1.9, 0.3, 0.35], [1.9, 0.3, 0.35], [-1.9, 0.3, -0.35], [1.9, 0.3, -0.35]].forEach(pos => {
          const leg = new THREE.Mesh(legGeo, woodBenchMat);
          leg.position.set(...pos); leg.castShadow = true; group.add(leg);
      });
      return group;
  }

  for (let i = 0; i < 8; i++) {
      const zPos = -12 + (i * 3.5); 
      const chairL = createChair(); chairL.position.set(-5.5, 0, zPos); scene.add(chairL);
      const chairR = createChair(); chairR.position.set(5.5, 0, zPos); scene.add(chairR);
  }

  // (F) 羅馬柱與鮮花球
  const pillarGeo = new THREE.CylinderGeometry(0.25, 0.3, 3, 32);
  const pillarMat = new THREE.MeshStandardMaterial({ color: 0xf0f0f0, roughness: 0.3, envMapIntensity: envInt });
  const flowerGeo = new THREE.SphereGeometry(0.6, 16, 16);
  const flowerMat = new THREE.MeshStandardMaterial({ color: 0xff69b4, roughness: 0.9, envMapIntensity: envInt }); 

  for (let i = 0; i < 6; i++) {
      const zPos = -13 + (i * 6);
      const pLeft = new THREE.Mesh(pillarGeo, pillarMat); pLeft.position.set(-2.6, 1.5, zPos); pLeft.castShadow = true; scene.add(pLeft);
      const fLeft = new THREE.Mesh(flowerGeo, flowerMat); fLeft.position.set(-2.6, 3.3, zPos); scene.add(fLeft);
      const pRight = new THREE.Mesh(pillarGeo, pillarMat); pRight.position.set(2.6, 1.5, zPos); pRight.castShadow = true; scene.add(pRight);
      const fRight = new THREE.Mesh(flowerGeo, flowerMat); fRight.position.set(2.6, 3.3, zPos); scene.add(fRight);
  }
}

// ---- 光線預設 (原版保留) ----
const PRESETS = {
  day:     { bg: 0xe9e2d6, sun: 0xffffff, sunI: 2.2, pos: [22, 26, 18], hemi: 1.0, hSky: 0xffffff, hGround: 0x9a9488, amb: 0.34, lamp: 0, exp: 1.0 },
  evening: { bg: 0xd8b892, sun: 0xffb066, sunI: 1.8, pos: [20, 12, 16], hemi: 0.6, hSky: 0xf3c58a, hGround: 0x5a4838, amb: 0.26, lamp: 1.2, exp: 1.0 },
  night:   { bg: 0x0f1420, sun: 0x4a5c92, sunI: 0.3, pos: [-16, 24, 14], hemi: 0.13, hSky: 0x2a3a5c, hGround: 0x0a0f16, amb: 0.05, lamp: 2.4, exp: 0.8 },
};
function applyLight(name) {
  const p = PRESETS[name];
  scene.background.setHex(p.bg); scene.fog.color.setHex(p.bg);
  sun.color.setHex(p.sun); sun.intensity = p.sunI; sun.position.set(...p.pos); sun.target.position.set(0, 0, 0);
  hemi.color.setHex(p.hSky); hemi.groundColor.setHex(p.hGround); hemi.intensity = p.hemi;
  ambient.intensity = p.amb; lamp.intensity = p.lamp; renderer.toneMappingExposure = p.exp;
  document.querySelectorAll('#lightSeg button').forEach(b => b.classList.toggle('active', b.dataset.light === name));
}

// ---- 相機：修改為娃娃屋透視的預設位置 ----
const START_POS = new THREE.Vector3(30, 25, 45);
const START_TARGET = new THREE.Vector3(0, 2, 0);
function cornerView() { camera.position.copy(START_POS); controls.target.copy(START_TARGET); }
controls.minDistance = 8; controls.maxDistance = 90;

const loader = new GLTFLoader();

// ===== 角色系統 (原版保留，修改走動範圍) =====
const clock = new THREE.Clock();
const characters = [];
const FACING = 0;             
const FOOT_LIFT = 0;          
const SPEED = 2.2;
let charH = 2.4;
// 修改走動範圍，讓他們主要在紅毯與座位附近走動
const WALK = { xMin: -6, xMax: 6, zMin: -18, zMax: 20 };
const clipBy = (clips, key) => clips.find(c => c.name.endsWith(key)) || clips.find(c => c.name.includes(key));

function pickTarget(ch) {
  ch.target.set(WALK.xMin + Math.random() * (WALK.xMax - WALK.xMin), 0, WALK.zMin + Math.random() * (WALK.zMax - WALK.zMin));
}
function playAct(ch, key) {
  if (ch.current === key || !ch.actions[key]) return;
  const next = ch.actions[key];
  if (ch.currentAction) ch.currentAction.fadeOut(0.25);
  if (key === 'wave') { next.setLoop(THREE.LoopOnce, 1); next.clampWhenFinished = true; }
  else next.setLoop(THREE.LoopRepeat, Infinity);
  next.reset().fadeIn(0.25).play();
  ch.currentAction = next; ch.current = key;
}
async function spawnChar(def, H, x, z) {
  const gltf = await new Promise((res, rej) => loader.load(def.url, res, undefined, rej));
  const root = gltf.scene;
  root.traverse(o => {
    if (o.isMesh) {
      if (!o.isSkinnedMesh) { o.visible = false; return; }   
      o.castShadow = true; o.frustumCulled = false;
      if (o.material) o.material.envMapIntensity = 0.5;
    }
  });
  root.scale.setScalar(H);
  const avatar = new THREE.Group(); avatar.add(root); avatar.position.set(x, FOOT_LIFT, z); scene.add(avatar);
  const mixer = new THREE.AnimationMixer(root);
  const actions = {
    idle: mixer.clipAction(clipBy(gltf.animations, 'Idle')),
    walk: mixer.clipAction(clipBy(gltf.animations, 'Walk')),
    wave: mixer.clipAction(clipBy(gltf.animations, 'Wave')),
  };
  const bubble = document.createElement('div');
  bubble.className = 'bubble'; bubble.textContent = def.greet; bubble.style.display = 'none';
  document.body.appendChild(bubble);
  const ch = { avatar, mixer, actions, current: null, currentAction: null, mode: 'walk', target: new THREE.Vector3(), timer: 0, cooldown: 0, H, bubble };
  pickTarget(ch); playAct(ch, 'walk'); characters.push(ch); return ch;
}
function faceToward(ch, px, pz) {
  ch.avatar.rotation.y = Math.atan2(px - ch.avatar.position.x, pz - ch.avatar.position.z) + FACING;
}
function greetPair(a, b) {
  a.mode = b.mode = 'greet'; a.timer = b.timer = 2.6;
  playAct(a, 'wave'); playAct(b, 'wave');
  a.bubble.style.display = b.bubble.style.display = 'block';
  faceToward(a, b.avatar.position.x, b.avatar.position.z);   
  faceToward(b, a.avatar.position.x, a.avatar.position.z);
}
const _v = new THREE.Vector3();
function updateChars(dt) {
  const GREET = charH * 1.05, MIN_SEP = charH * 0.85;
  for (const ch of characters) {
    ch.mixer.update(dt);
    if (ch.cooldown > 0) ch.cooldown -= dt;
    if (ch.mode === 'greet') {
      ch.timer -= dt;
      if (ch.timer <= 0) { ch.mode = 'walk'; ch.cooldown = 3; ch.bubble.style.display = 'none'; pickTarget(ch); playAct(ch, 'walk'); }
      continue;
    }
    const dir = ch.target.clone().sub(ch.avatar.position); dir.y = 0; const dist = dir.length();
    if (dist < 0.3) pickTarget(ch);
    else { dir.normalize(); ch.avatar.position.addScaledVector(dir, Math.min(SPEED * dt, dist)); faceToward(ch, ch.target.x, ch.target.z); }
  }
  for (let i = 0; i < characters.length; i++) for (let j = i + 1; j < characters.length; j++) {
    const a = characters[i], b = characters[j];
    const dx = a.avatar.position.x - b.avatar.position.x, dz = a.avatar.position.z - b.avatar.position.z;
    const d = Math.hypot(dx, dz);
    if (d > 0.001 && d < MIN_SEP) {
      const push = (MIN_SEP - d) / 2, nx = dx / d, nz = dz / d;
      a.avatar.position.x += nx * push; a.avatar.position.z += nz * push;
      b.avatar.position.x -= nx * push; b.avatar.position.z -= nz * push;
    }
  }
  for (let i = 0; i < characters.length; i++) for (let j = i + 1; j < characters.length; j++) {
    const a = characters[i], b = characters[j];
    if (a.mode !== 'walk' || b.mode !== 'walk' || a.cooldown > 0 || b.cooldown > 0) continue;
    if (a.avatar.position.distanceTo(b.avatar.position) < GREET) greetPair(a, b);
  }
  for (const ch of characters) {
    if (ch.bubble.style.display === 'none') continue;
    _v.copy(ch.avatar.position); _v.y += ch.H * 1.15; _v.project(camera);
    ch.bubble.style.left = (_v.x * 0.5 + 0.5) * innerWidth + 'px';
    ch.bubble.style.top = (-_v.y * 0.5 + 0.5) * innerHeight + 'px';
  }
}

// ---- 啟動 ----
(async function init() {
  try {
    buildRoom();
    
    // 移除原本不搭的沙發、書櫃，只保留人物載入
    const forceGreet = location.hash.includes('greet');
    await Promise.all([
      spawnChar(CHAR_DEFS[0], charH, forceGreet ? 0 : -2, forceGreet ? 4 : 6),
      spawnChar(CHAR_DEFS[1], charH, forceGreet ? 1.4 : 2, forceGreet ? 4 : 2),
    ]);

    cornerView();
    const lightHash = location.hash.slice(1).replace('greet', '');
    applyLight(['day', 'evening', 'night'].includes(lightHash) ? lightHash : 'day');
    document.getElementById('loading').style.display = 'none';
    animate();
  } catch (e) {
    document.getElementById('loadmsg').textContent = '載入失敗：' + e.message;
    console.error(e);
  }
})();

document.getElementById('lightSeg').addEventListener('click', e => { if (e.target.dataset.light) applyLight(e.target.dataset.light); });
let autoOrbit = false;
const btnOrbit = document.getElementById('btnOrbit');
btnOrbit.addEventListener('click', () => { autoOrbit = !autoOrbit; controls.autoRotate = autoOrbit; btnOrbit.classList.toggle('active', autoOrbit); });
document.getElementById('btnReset').addEventListener('click', cornerView);
addEventListener('keydown', e => { if (e.key === '1') applyLight('day'); if (e.key === '2') applyLight('evening'); if (e.key === '3') applyLight('night'); });
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  updateChars(dt);
  controls.update();
  renderer.render(scene, camera);
}
</script>
</body>
</html>
